<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanka | Protected</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #content { display: none; } /* This hides your store until login */
    </style>
</head>
<body>

    <div id="login-gate" class="login-box">
        <h2>Sanka.co.za</h2>
        <p>Please enter the access code:</p>
        <input type="password" id="pass-field" placeholder="Password">
        <br>
        <button onclick="checkPass()">Enter Site</button>
        <p id="error-msg" style="color:red; display:none;">Incorrect Password</p>
    </div>

    <div id="content" class="login-box">
        <h1>Welcome to Sanka</h1>
        <p>Store and Retailer content goes here.</p>
        <button onclick="location.reload()">Logout</button>
    </div>

    <script>
        function checkPass() {
            var password = document.getElementById("pass-field").value;
            
            // CHANGE YOUR PASSWORD HERE
            if (password === "Sanka2026") { 
                document.getElementById("login-gate").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>

</body>
</html>
