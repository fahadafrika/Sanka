<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanka Cash & Carry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', Arial, sans-serif; background: #0f0f13; min-height: 100vh; }

        /* ── LOGIN PAGE ─────────────────────────────────────────────── */
        /* opens as an overlay on top of the customer catalogue */
        #login-gate {
            position: fixed; inset: 0; z-index: 1000;
            overflow-x: hidden; overflow-y: auto;
            display: none; justify-content: center; align-items: center;
            padding: 24px 16px;
            background: rgba(9,9,13,0.88);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.25s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #close-login {
            position: absolute; top: 14px; right: 14px;
            width: 34px; height: 34px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6); font-size: 15px; cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        #close-login:hover { background: rgba(255,255,255,0.1); color: white; }
        /* soft animated glow blobs */
        .blob {
            position: absolute; border-radius: 50%;
            filter: blur(80px); opacity: 0.55; pointer-events: none;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .blob-1 { width: 420px; height: 420px; background: #f59e0b; top: -160px; left: -120px; opacity: 0.28; }
        .blob-2 { width: 380px; height: 380px; background: #6366f1; bottom: -140px; right: -100px; opacity: 0.3; animation-delay: -6s; }
        .blob-3 { width: 260px; height: 260px; background: #ef4444; top: 45%; left: 60%; opacity: 0.16; animation-delay: -12s; }
        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(40px, 30px) scale(1.08); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }
        /* faint grid texture */
        #login-gate::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .login-box {
            position: relative; z-index: 1;
            width: 100%; max-width: 380px;
            padding: 40px 32px 28px;
            border-radius: 28px;
            background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
            text-align: center;
            animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }
        .login-box.shake { animation: shake 0.4s; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
        }

        .login-logo {
            width: 68px; height: 68px; margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #fbbf24, #f97316 55%, #ef4444);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 12px 32px rgba(249,115,22,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .login-box h2 {
            font-size: 22px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.15;
            background: linear-gradient(180deg, #ffffff, rgba(255,255,255,0.7));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 10px;
        }
        .live-pill {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 5px 12px; border-radius: 999px;
            background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25);
            color: #6ee7b7; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
            margin-bottom: 28px;
        }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; position: relative; }
        .live-dot::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%; background: #10b981;
            animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite;
        }
        @keyframes ping { 75%,100% { transform: scale(2.6); opacity: 0; } }

        .field-label {
            display: block; text-align: left;
            font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            color: rgba(255,255,255,0.45); margin-bottom: 8px;
        }
        .pass-wrap { position: relative; margin-bottom: 14px; }
        .pass-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.55; pointer-events: none;
        }
        #email-field { padding-right: 16px !important; }
        .pass-wrap + .field-label { margin-top: 14px; }
        #forgot-btn {
            display: block; margin: -6px 0 14px auto; background: none; border: none;
            color: rgba(251,191,36,0.85); font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
        }
        #forgot-btn:hover { color: #fbbf24; text-decoration: underline; }
        #pass-field, #email-field {
            width: 100%; padding: 15px 48px 15px 44px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; font-size: 15px;
            outline: none; color: white;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: 'Inter', Arial, sans-serif;
        }
        #pass-field::placeholder, #email-field::placeholder { color: rgba(255,255,255,0.3); }
        #pass-field:focus, #email-field:focus {
            border-color: rgba(245,158,11,0.7);
            background: rgba(0,0,0,0.35);
            box-shadow: 0 0 0 4px rgba(245,158,11,0.15);
        }
        #toggle-pass {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border-radius: 10px;
            border: none; background: transparent; cursor: pointer;
            font-size: 15px; opacity: 0.6; transition: opacity 0.2s, background 0.2s;
        }
        #toggle-pass:hover { opacity: 1; background: rgba(255,255,255,0.06); }

        .btn {
            width: 100%; padding: 15px; border-radius: 14px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        #login-btn {
            border: none; color: #1a1205;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            box-shadow: 0 8px 24px rgba(249,115,22,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        #login-btn:hover { box-shadow: 0 12px 32px rgba(249,115,22,0.5), inset 0 1px 0 rgba(255,255,255,0.3); transform: translateY(-1px); }
        #login-btn:disabled { opacity: 0.7; cursor: wait; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 18px 0; color: rgba(255,255,255,0.3);
            font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

        .view-only-btn {
            color: #6ee7b7;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.3);
        }
        .view-only-btn:hover { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.5); transform: translateY(-1px); }

        #error-msg {
            display: none; margin: -4px 0 14px;
            padding: 10px 12px; border-radius: 12px;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5; font-size: 13px; font-weight: 600; text-align: left;
        }

        .login-footer {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 26px; padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.35); font-size: 12px; font-weight: 500;
        }
        /* Somali flag: blue circle + white star */
        .somalia-flag {
            width: 20px; height: 20px; border-radius: 50%;
            background: #4189DD; color: white;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; line-height: 1;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 2px 8px rgba(65,137,221,0.5);
        }

        /* ── LIQUID GLASS STOCK CARDS ───────────────────────────────── */
        /* soft ambient colour behind the list so the glass has something to refract */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(40vmax 40vmax at 10% 15%, rgba(16,185,129,0.16), transparent 70%),
                radial-gradient(35vmax 35vmax at 90% 45%, rgba(250,204,21,0.12), transparent 70%),
                radial-gradient(40vmax 40vmax at 30% 95%, rgba(239,68,68,0.14), transparent 70%);
        }
        .glass-card {
            --tint: 16,185,129;               /* r,g,b — set per status below */
            --mx: 50%; --my: 0%;              /* pointer position, set by JS */
            position: relative; isolation: isolate;
            border-radius: 18px; overflow: hidden;
            background:
                linear-gradient(135deg, rgba(var(--tint),0.30), rgba(var(--tint),0.10) 55%, rgba(var(--tint),0.18));
            border: 1px solid rgba(var(--tint),0.40);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.28),      /* top rim highlight */
                inset 0 -1px 0 rgba(255,255,255,0.05),
                inset 0 0 24px rgba(var(--tint),0.12),     /* inner glow */
                0 8px 24px rgba(0,0,0,0.28);
            transition: transform 0.35s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.3s, border-color 0.3s;
        }
        /* glossy sheen across the top half */
        .glass-card::before {
            content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 45%, transparent 60%);
        }
        /* light that follows the finger / mouse */
        .glass-card::after {
            content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background: radial-gradient(220px circle at var(--mx) var(--my), rgba(255,255,255,0.20), transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .glass-card:hover::after, .glass-card.glass-touch::after { opacity: 1; }
        .glass-card:hover {
            transform: translateY(-2px) scale(1.008);
            border-color: rgba(var(--tint),0.6);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.35),
                inset 0 -1px 0 rgba(255,255,255,0.06),
                inset 0 0 30px rgba(var(--tint),0.18),
                0 14px 34px rgba(0,0,0,0.35), 0 0 0 1px rgba(var(--tint),0.12);
        }
        .glass-card:active { transform: scale(0.985); transition-duration: 0.12s; }

        .glass-green  { --tint: 16,185,129; }   /* in stock */
        .glass-yellow { --tint: 234,179,8;  }   /* running low */
        .glass-red    { --tint: 239,68,68;  }   /* finished / something missing */

        @media (prefers-reduced-motion: reduce) {
            .glass-card, .glass-card:hover, .glass-card:active { transition: none; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .blob, .login-logo, .live-dot::after, .login-box { animation: none; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
</head>
<body>

<div id="login-gate">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-box" id="login-box">
        <button type="button" id="close-login" title="Back to catalogue">✕</button>
        <div class="login-logo">🛒</div>
        <h2>Sanka Cash &amp; Carry</h2>
        <div class="live-pill"><span class="live-dot"></span>STAFF ACCESS</div>

        <label class="field-label" for="email-field">Staff email</label>
        <div class="pass-wrap">
            <span class="pass-icon">✉️</span>
            <input type="email" id="email-field" placeholder="you@example.com" autocomplete="username" />
        </div>
        <label class="field-label" for="pass-field">Password</label>
        <div class="pass-wrap">
            <span class="pass-icon">🔒</span>
            <input type="password" id="pass-field" placeholder="Enter password to edit" autocomplete="current-password" />
            <button type="button" id="toggle-pass" title="Show password">👁</button>
        </div>
        <button type="button" id="forgot-btn">Forgot password?</button>
        <p id="error-msg">❌ Incorrect email or password. Try again.</p>
        <button class="btn" id="login-btn">✏️ Edit Dashboard</button>

        <div class="divider">or</div>
        <button class="btn view-only-btn" id="view-btn">← Back to Catalogue</button>

        <div class="login-footer">
            <span class="somalia-flag">★</span>
            <span>Proudly serving the community</span>
        </div>
    </div>
</div>

<div id="content">
    <div id="inventory-root"></div>
</div>

<script>
// ─── FIREBASE ─────────────────────────────────────────────────────────────────
// Web app config (public by design — the database rules are what keep data safe)
const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyBeIHokETiP9lEyZLH9mmam3gWo6HJnhs0",
    authDomain:        "sanka-stock.firebaseapp.com",
    databaseURL:       "https://sanka-stock-default-rtdb.firebaseio.com",
    projectId:         "sanka-stock",
    storageBucket:     "sanka-stock.firebasestorage.app",
    messagingSenderId: "453068624760",
    appId:             "1:453068624760:web:069f6bda9a305dfe502e8d",
};
try { firebase.initializeApp(FIREBASE_CONFIG); } catch(e) {}
const firebaseReady = typeof firebase !== "undefined" && firebase.apps && firebase.apps.length;
const db   = firebaseReady ? firebase.database() : null;
const auth = firebaseReady && firebase.auth ? firebase.auth() : null;

// ─── BACK BUTTON TRAP ─────────────────────────────────────────────────────────
// Push a fake history state so Android back button doesn't exit the app
history.pushState({ page: "app" }, "", window.location.href);
window.addEventListener("popstate", function(e) {
    // Re-push so back button never actually goes back
    history.pushState({ page: "app" }, "", window.location.href);
});

// ─── STAFF LOGIN (Firebase Authentication) ────────────────────────────────────
let isEditor = false;

function showLoginError(msg) {
    const errMsg = document.getElementById("error-msg");
    errMsg.textContent = msg;
    errMsg.style.display = "block";
    const box = document.getElementById("login-box");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
}

async function validate() {
    const email = document.getElementById("email-field").value.trim();
    const password = document.getElementById("pass-field").value;
    if (!email || !password) return showLoginError("❌ Enter your email and password.");
    if (!auth) return showLoginError("⚠️ Login is unavailable — check your connection.");
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    try {
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged (below) opens the editor
    } catch (err) {
        document.getElementById("pass-field").value = "";
        const code = err && err.code;
        if (code === "auth/too-many-requests") showLoginError("⏳ Too many attempts. Wait a few minutes and try again.");
        else if (code === "auth/network-request-failed") showLoginError("⚠️ No internet connection.");
        else if (code === "auth/invalid-email") showLoginError("❌ That email address isn't valid.");
        else showLoginError("❌ Incorrect email or password. Try again.");
    } finally {
        btn.disabled = false;
    }
}

async function forgotPassword() {
    const email = document.getElementById("email-field").value.trim();
    if (!email) return showLoginError("✉️ Type your email above, then tap “Forgot password?”.");
    if (!auth) return showLoginError("⚠️ Login is unavailable — check your connection.");
    try {
        await auth.sendPasswordResetEmail(email);
    } catch (err) {
        if (err && err.code === "auth/invalid-email") return showLoginError("❌ That email address isn't valid.");
        // Other errors stay hidden so the form doesn't reveal which emails have accounts
    }
    const errMsg = document.getElementById("error-msg");
    errMsg.textContent = "📬 If that email has a staff account, a reset link is on its way.";
    errMsg.style.display = "block";
}
document.getElementById("forgot-btn").addEventListener("click", forgotPassword);
document.getElementById("toggle-pass").addEventListener("click", () => {
    const f = document.getElementById("pass-field");
    const show = f.type === "password";
    f.type = show ? "text" : "password";
    document.getElementById("toggle-pass").textContent = show ? "🙈" : "👁";
    document.getElementById("toggle-pass").title = show ? "Hide password" : "Show password";
    f.focus();
});
["pass-field", "email-field"].forEach(id => document.getElementById(id).addEventListener("input", () => {
    document.getElementById("error-msg").style.display = "none";
}));
// Customers land on the catalogue; staff open the login overlay from the top corner
function openLogin() {
    document.getElementById("pass-field").value = "";
    document.getElementById("error-msg").style.display = "none";
    document.getElementById("login-gate").style.display = "flex";
    const emailField = document.getElementById("email-field");
    setTimeout(() => (emailField.value ? document.getElementById("pass-field") : emailField).focus(), 50);
}
function closeLogin() {
    document.getElementById("login-gate").style.display = "none";
}
function launchApp() {
    closeLogin();
    mountInventory(isEditor);
}
function logout() {
    if (auth) auth.signOut(); // onAuthStateChanged (below) switches back to the catalogue
    else { isEditor = false; mountInventory(false); }
}
document.getElementById("login-btn").addEventListener("click", validate);
document.getElementById("view-btn").addEventListener("click", closeLogin);
document.getElementById("close-login").addEventListener("click", closeLogin);
document.getElementById("login-gate").addEventListener("click", ev => { if (ev.target.id === "login-gate") closeLogin(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeLogin(); });
["pass-field", "email-field"].forEach(id => document.getElementById(id).addEventListener("keypress", e => { if (e.key === "Enter") validate(); }));
// Staff stay signed in on this device until they log out
if (auth) {
    auth.onAuthStateChanged(user => {
        const signedIn = !!user;
        if (signedIn === isEditor) return;
        isEditor = signedIn;
        if (signedIn) launchApp(); else mountInventory(false);
    });
}

// ─── LIQUID GLASS: light follows the pointer across stock cards ───────────────
function moveGlassLight(ev) {
    const card = ev.target.closest && ev.target.closest(".glass-card");
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (ev.clientX - r.left) + "px");
    card.style.setProperty("--my", (ev.clientY - r.top) + "px");
    if (ev.pointerType === "touch") card.classList.add("glass-touch");
}
document.addEventListener("pointermove", moveGlassLight, { passive: true });
document.addEventListener("pointerdown", moveGlassLight, { passive: true });
document.addEventListener("pointerup", ev => {
    const card = ev.target.closest && ev.target.closest(".glass-card");
    if (card) setTimeout(() => card.classList.remove("glass-touch"), 350);
}, { passive: true });

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const DEFAULT_FLAVORS = [
    "Durban Curry","Chicken","Beef","Original","Cheese",
    "BBQ","Tomato","Spicy","Plain","Strawberry",
    "Bubblegum","Cola","Lemon","Grape","Watermelon"
];

// Sale type options
const SALE_TYPES = ["Loose", "Box", "Both"];

function calcMargin(sell, cost) {
    const s = parseFloat(sell), c = parseFloat(cost);
    return (s && c) ? ((s - c) / s * 100).toFixed(1) : null;
}

// Below this quantity an item (or loose/box unit, or flavor) shows yellow as "low stock"
const LOW_STOCK = 10;
const isLowQty = q => q > 0 && q < LOW_STOCK;

// Each way an item is sold (loose / box) with its own qty + prices
function getUnits(item) {
    const loose = { key:"loose", label:"📦 Loose", qty:item.quantity, sell:item.sellPrice, cost:item.costPrice, accent:"#60a5fa" };
    if (item.saleType === "Both")
        return [ loose, { key:"box", label:"🗃️ Box", qty:item.boxQuantity||0, sell:item.boxSellPrice, cost:item.boxCostPrice, per:item.unitsPerBox, accent:"#a78bfa" } ];
    if (item.saleType === "Box")
        return [ { key:"box", label:"🗃️ Box", qty:item.quantity, sell:item.sellPrice, cost:item.costPrice, per:item.unitsPerBox, accent:"#a78bfa" } ];
    return [ loose ];
}
function isLowStock(item) {
    return !item.outOfStock && getUnits(item).some(u => isLowQty(u.qty));
}

const S = {
    input:  { width:"100%", padding:"11px 14px", borderRadius:10, border:"1px solid rgba(255,255,255,0.1)", fontSize:14, outline:"none", boxSizing:"border-box", background:"rgba(255,255,255,0.05)", color:"white", fontFamily:"'Inter',Arial,sans-serif" },
    label:  { fontSize:11, fontWeight:700, color:"rgba(255,255,255,0.4)", display:"block", marginBottom:5, letterSpacing:"0.06em", textTransform:"uppercase" },
};

// ─── MOUNT ────────────────────────────────────────────────────────────────────
function mountInventory(canEdit) {
    const { useState, useEffect } = React;
    const e = React.createElement;

    // ── BADGE ────────────────────────────────────────────────────────────────
    function Badge({ children, color }) {
        const p = {
            green:  { background:"rgba(16,185,129,0.15)",  color:"#34d399", border:"1px solid rgba(16,185,129,0.2)" },
            red:    { background:"rgba(239,68,68,0.15)",   color:"#f87171", border:"1px solid rgba(239,68,68,0.2)" },
            orange: { background:"rgba(249,115,22,0.15)",  color:"#fb923c", border:"1px solid rgba(249,115,22,0.25)" },
            yellow: { background:"rgba(250,204,21,0.15)",  color:"#fde047", border:"1px solid rgba(250,204,21,0.3)" },
            amber:  { background:"rgba(251,191,36,0.18)",  color:"#fde68a", border:"1px solid rgba(251,191,36,0.35)" },
            indigo: { background:"rgba(99,102,241,0.15)",  color:"#a5b4fc", border:"1px solid rgba(99,102,241,0.2)" },
            blue:   { background:"rgba(59,130,246,0.15)",  color:"#93c5fd", border:"1px solid rgba(59,130,246,0.2)" },
            pink:   { background:"rgba(236,72,153,0.15)",  color:"#f9a8d4", border:"1px solid rgba(236,72,153,0.2)" },
        };
        return e("span", { style:{ ...(p[color]||p.indigo), padding:"2px 9px", borderRadius:999, fontSize:11, fontWeight:700, whiteSpace:"nowrap" }}, children);
    }

    // ── ICON BUTTON ──────────────────────────────────────────────────────────
    function Btn({ onClick, style, children, title }) {
        return e("button", { onClick, title, style:{ border:"none", borderRadius:9, width:32, height:32, cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, ...style }}, children);
    }

    // ── INPUT FIELD ──────────────────────────────────────────────────────────
    function InputField({ label, value, onChange, placeholder, type="text", prefix }) {
        return e("div", { style:{ marginBottom:14 }},
            e("label", { style:S.label }, label),
            e("div", { style:{ position:"relative" }},
                prefix && e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"rgba(255,255,255,0.3)", fontSize:13, fontWeight:600 }}, prefix),
                e("input", { type, value, onChange, placeholder, style:{ ...S.input, paddingLeft: prefix ? 28 : 14 }})
            )
        );
    }

    // ── TOGGLE ROW ───────────────────────────────────────────────────────────
    function ToggleRow({ on, onClick, label, sub, color }) {
        const activeColor = color || "#f59e0b";
        const activeBg    = color ? `${color}18` : "rgba(245,158,11,0.08)";
        const activeBorder= color ? `${color}50` : "rgba(245,158,11,0.3)";
        return e("div", { onClick, style:{ display:"flex", alignItems:"center", gap:14, background:on?activeBg:"rgba(255,255,255,0.03)", border:`1px solid ${on?activeBorder:"rgba(255,255,255,0.08)"}`, borderRadius:12, padding:"13px 16px", marginBottom:12, cursor:"pointer" }},
            e("div", { style:{ width:42, height:24, borderRadius:12, background:on?activeColor:"rgba(255,255,255,0.1)", position:"relative", flexShrink:0, transition:"background 0.2s" }},
                e("div", { style:{ position:"absolute", top:3, left:on?21:3, width:18, height:18, borderRadius:"50%", background:"white", transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.3)" }})
            ),
            e("div", null,
                e("div", { style:{ fontWeight:700, fontSize:14, color:"white" }}, label),
                e("div", { style:{ fontSize:12, color:"rgba(255,255,255,0.4)" }}, sub)
            )
        );
    }

    // ── FLAVOR MANAGER ───────────────────────────────────────────────────────
    function FlavorManager({ flavors, onClose, onSave }) {
        const [list, setList]     = useState([...flavors]);
        const [newFl, setNewFl]   = useState("");
        const [search, setSearch] = useState("");
        const filtered = list.filter(f => f.toLowerCase().includes(search.toLowerCase()));

        function add() {
            const t = newFl.trim();
            if (!t || list.map(f=>f.toLowerCase()).includes(t.toLowerCase())) { setNewFl(""); return; }
            setList([...list, t]); setNewFl("");
        }

        return e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:300, backdropFilter:"blur(4px)" }, onClick:ev=>{ if(ev.target===ev.currentTarget) onClose(); }},
            e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"24px 24px 0 0", padding:"28px 24px 48px", width:"100%", maxWidth:520, maxHeight:"80vh", overflowY:"auto" }},
                e("div", { style:{ width:36, height:4, background:"rgba(255,255,255,0.15)", borderRadius:2, margin:"0 auto 24px" }}),
                e("div", { style:{ fontWeight:800, fontSize:18, marginBottom:6, color:"white" }}, "🎨 Manage Flavors"),
                e("div", { style:{ fontSize:13, color:"rgba(255,255,255,0.4)", marginBottom:20 }}, "Add or remove flavors across all items."),
                e("div", { style:{ display:"flex", gap:8, marginBottom:12 }},
                    e("input", { value:newFl, onChange:ev=>setNewFl(ev.target.value), onKeyDown:ev=>{ if(ev.key==="Enter") add(); }, placeholder:"New flavor name...", style:{ ...S.input, flex:1 }}),
                    e("button", { onClick:add, style:{ padding:"11px 18px", borderRadius:10, background:"linear-gradient(135deg,#f59e0b,#f97316)", color:"#1a1a2e", border:"none", fontWeight:800, cursor:"pointer", fontSize:13 }}, "Add")
                ),
                e("div", { style:{ position:"relative", marginBottom:10 }},
                    e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:14, pointerEvents:"none" }}, "🔍"),
                    e("input", { value:search, onChange:ev=>setSearch(ev.target.value), placeholder:"Search flavors...", style:{ ...S.input, paddingLeft:36 }})
                ),
                e("div", { style:{ fontSize:11, color:"rgba(255,255,255,0.3)", fontWeight:600, marginBottom:10 }},
                    filtered.length===list.length ? `${list.length} flavor${list.length!==1?"s":""}` : `${filtered.length} of ${list.length} flavors`
                ),
                e("div", { style:{ display:"flex", flexDirection:"column", gap:6, marginBottom:28 }},
                    filtered.length===0
                        ? e("div", { style:{ textAlign:"center", padding:"20px 0", color:"rgba(255,255,255,0.2)", fontSize:13 }}, "No flavors match")
                        : filtered.map(f => e("div", { key:f, style:{ display:"flex", justifyContent:"space-between", alignItems:"center", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:10, padding:"10px 14px" }},
                            e("span", { style:{ fontSize:14, fontWeight:600, color:"rgba(255,255,255,0.85)" }}, f),
                            e("button", { onClick:()=>setList(list.filter(x=>x!==f)), style:{ background:"rgba(239,68,68,0.15)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:7, padding:"4px 12px", color:"#f87171", fontWeight:700, cursor:"pointer", fontSize:12 }}, "Remove")
                        ))
                ),
                e("div", { style:{ display:"flex", gap:10 }},
                    e("button", { onClick:onClose, style:{ flex:1, padding:14, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontSize:14, fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)" }}, "Cancel"),
                    e("button", { onClick:()=>{ onSave(list); onClose(); }, style:{ flex:2, padding:14, borderRadius:12, border:"none", background:"linear-gradient(135deg,#f59e0b,#f97316)", fontSize:14, fontWeight:800, cursor:"pointer", color:"#1a1a2e" }}, "Save Flavors")
                )
            )
        );
    }

    // ── ITEM MODAL ───────────────────────────────────────────────────────────
    function ItemModal({ modal, flavors, onClose, onSubmit }) {
        const isAdd = modal === "add";
        const [form, setForm] = useState(isAdd
            ? { name:"", category:"", quantity:"", sellPrice:"", costPrice:"", boxQuantity:"", boxSellPrice:"", boxCostPrice:"", unitsPerBox:"", priceUp:false, saleType:"Loose", flavors:[] }
            : {
                name:      modal.item.name,
                category:  modal.item.category  || "",
                quantity:  String(modal.item.quantity),
                sellPrice: modal.item.sellPrice  != null ? String(modal.item.sellPrice) : "",
                costPrice: modal.item.costPrice  != null ? String(modal.item.costPrice) : "",
                boxQuantity:  modal.item.boxQuantity  != null ? String(modal.item.boxQuantity)  : "",
                boxSellPrice: modal.item.boxSellPrice != null ? String(modal.item.boxSellPrice) : "",
                boxCostPrice: modal.item.boxCostPrice != null ? String(modal.item.boxCostPrice) : "",
                unitsPerBox:  modal.item.unitsPerBox  != null ? String(modal.item.unitsPerBox)  : "",
                priceUp:  modal.item.priceUp    || false,
                saleType:  modal.item.saleType   || "Loose",
                flavors:   modal.item.flavors    ? modal.item.flavors.map(f=>({...f})) : [],
            }
        );
        const [flavorSearch, setFlavorSearch] = useState("");
        const selectedNames  = form.flavors.map(f => f.name);
        const visibleFlavors = flavors.filter(f => f.toLowerCase().includes(flavorSearch.toLowerCase()));

        function toggleFlavor(name) {
            const exists = form.flavors.find(f=>f.name===name);
            setForm({ ...form, flavors: exists
                ? form.flavors.filter(f=>f.name!==name)
                : [...form.flavors, { name, quantity:0, outOfStock:false, priceUp:false }]
            });
        }
        function setFlavorQty(name, val) {
            const qty = Math.max(0, parseInt(val)||0);
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,quantity:qty,outOfStock:qty===0}:f) });
        }
        function toggleFlavorStock(name) {
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,outOfStock:!f.outOfStock,quantity:!f.outOfStock?0:f.quantity}:f) });
        }
        // ── NEW: toggle per-flavor price increase
        function toggleFlavorPriceUp(name) {
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,priceUp:!f.priceUp}:f) });
        }

        // Switching Box <-> Both moves the box numbers so they aren't mistaken for loose ones
        function setSaleType(type) {
            const prev = form.saleType;
            if (prev === type) return;
            let next = { ...form, saleType:type };
            if (prev === "Box" && type === "Both")
                next = { ...next, boxQuantity:form.quantity, boxSellPrice:form.sellPrice, boxCostPrice:form.costPrice, quantity:"", sellPrice:"", costPrice:"" };
            else if (prev === "Both" && type === "Box")
                next = { ...next, quantity:form.boxQuantity, sellPrice:form.boxSellPrice, costPrice:form.boxCostPrice, boxQuantity:"", boxSellPrice:"", boxCostPrice:"" };
            setForm(next);
        }

        function numInput(label, key, placeholder) {
            return e("div", null,
                e("label", { style:S.label }, label),
                e("input", { type:"number", value:form[key], onChange:ev=>setForm({...form,[key]:ev.target.value}), placeholder, style:S.input })
            );
        }
        function priceInput(label, key) {
            return e("div", null,
                e("label", { style:S.label }, label),
                e("div", { style:{ position:"relative" }},
                    e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"rgba(255,255,255,0.3)", fontSize:13, fontWeight:600 }}, "R"),
                    e("input", { type:"number", value:form[key], onChange:ev=>setForm({...form,[key]:ev.target.value}), placeholder:"0.00", style:{ ...S.input, paddingLeft:26 }})
                )
            );
        }
        // One block per way the item is sold (loose / box), each with its own qty and prices
        function unitSection({ title, accent, qtyKey, sellKey, costKey, perBox }) {
            const m = calcMargin(form[sellKey], form[costKey]);
            const good = m !== null && parseFloat(m) >= 20;
            return e("div", { style:{ border:`1px solid ${accent}40`, background:`${accent}0d`, borderRadius:14, padding:"14px 14px 2px", marginBottom:14 }},
                e("div", { style:{ fontWeight:800, fontSize:13, color:accent, marginBottom:12 }}, title),
                e("div", { style:{ display:"grid", gridTemplateColumns:perBox?"1fr 1fr":"1fr", gap:10, marginBottom:12 }},
                    numInput(perBox ? "Boxes in stock" : "Quantity", qtyKey, "0"),
                    perBox && numInput("Units per box", "unitsPerBox", "e.g. 24")
                ),
                e("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }},
                    priceInput("Selling Price", sellKey),
                    priceInput("Cost Price", costKey)
                ),
                m !== null && e("div", { style:{ background:good?"rgba(16,185,129,0.1)":"rgba(245,158,11,0.1)", border:`1px solid ${good?"rgba(16,185,129,0.2)":"rgba(245,158,11,0.2)"}`, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", justifyContent:"space-between", alignItems:"center" }},
                    e("span", { style:{ fontSize:12, color:"rgba(255,255,255,0.5)", fontWeight:600 }}, "Profit Margin"),
                    e("span", { style:{ fontSize:14, fontWeight:800, color:good?"#34d399":"#fbbf24" }}, m + "%")
                )
            );
        }

        // Sale type button style
        function saleTypeBtnStyle(type) {
            const active = form.saleType === type;
            return {
                flex:1, padding:"10px 6px", borderRadius:10, border:"none", cursor:"pointer", fontWeight:700, fontSize:13,
                background: active ? "linear-gradient(135deg,#f59e0b,#f97316)" : "rgba(255,255,255,0.06)",
                color: active ? "#1a1a2e" : "rgba(255,255,255,0.5)",
                transition:"all 0.15s",
            };
        }

        return e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:200, backdropFilter:"blur(4px)" }, onClick:ev=>{ if(ev.target===ev.currentTarget) onClose(); }},
            e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"24px 24px 0 0", padding:"28px 24px 48px", width:"100%", maxWidth:520, maxHeight:"94vh", overflowY:"auto" }},
                e("div", { style:{ width:36, height:4, background:"rgba(255,255,255,0.15)", borderRadius:2, margin:"0 auto 24px" }}),
                e("div", { style:{ fontWeight:800, fontSize:18, marginBottom:24, color:"white" }}, isAdd ? "➕ Add New Item" : "✏️ Edit Item"),

                e(InputField, { label:"Item Name *",    value:form.name,     onChange:ev=>setForm({...form,name:ev.target.value}),     placeholder:"e.g. Maggi Noodles" }),
                e(InputField, { label:"Category",       value:form.category, onChange:ev=>setForm({...form,category:ev.target.value}), placeholder:"e.g. Noodles, Sweets, Chips" }),
                // ── SALE TYPE TOGGLE ─────────────────────────────────────
                e("div", { style:{ marginBottom:16 }},
                    e("label", { style:S.label }, "Sold As"),
                    e("div", { style:{ display:"flex", gap:8 }},
                        SALE_TYPES.map(type =>
                            e("button", { key:type, onClick:()=>setSaleType(type), style:saleTypeBtnStyle(type) },
                                type === "Loose" ? "📦 Loose" : type === "Box" ? "🗃️ Box" : "📦🗃️ Both"
                            )
                        )
                    )
                ),

                // ── STOCK + PRICES (separate for loose and box) ─────────
                form.saleType !== "Box" && unitSection({ title:"📦 Loose — single units", accent:"#60a5fa", qtyKey:"quantity", sellKey:"sellPrice", costKey:"costPrice" }),
                form.saleType === "Box" && unitSection({ title:"🗃️ Whole Box", accent:"#a78bfa", qtyKey:"quantity", sellKey:"sellPrice", costKey:"costPrice", perBox:true }),
                form.saleType === "Both" && unitSection({ title:"🗃️ Whole Box", accent:"#a78bfa", qtyKey:"boxQuantity", sellKey:"boxSellPrice", costKey:"boxCostPrice", perBox:true }),

                // toggles
                e(ToggleRow, { on:form.priceUp, onClick:()=>setForm({...form,priceUp:!form.priceUp}), label:"Item Price Increased", sub:"Flag this item's overall price went up" }),

                // ── FLAVORS ──────────────────────────────────────────────
                e("div", { style:{ marginBottom:24 }},
                    e("div", { style:{ fontWeight:700, fontSize:13, color:"rgba(255,255,255,0.6)", marginBottom:12, letterSpacing:"0.06em", textTransform:"uppercase" }}, "🎨 Flavors / Variants"),

                    form.flavors.length > 0 && e("div", { style:{ marginBottom:12 }},
                        e("div", { style:{ fontSize:12, color:"rgba(255,255,255,0.35)", marginBottom:8 }}, "Selected — manage each flavor:"),
                        e("div", { style:{ display:"flex", flexDirection:"column", gap:6 }},
                            form.flavors.map(f => e("div", { key:f.name, style:{ background:f.outOfStock?"rgba(239,68,68,0.08)":f.priceUp?"rgba(245,158,11,0.08)":"rgba(16,185,129,0.08)", border:`1px solid ${f.outOfStock?"rgba(239,68,68,0.2)":f.priceUp?"rgba(245,158,11,0.3)":"rgba(16,185,129,0.2)"}`, borderRadius:10, padding:"10px 12px" }},
                                // top row: dot + name + qty + oos + remove
                                e("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom: f.priceUp ? 6 : 0 }},
                                    e("div", { style:{ width:7, height:7, borderRadius:"50%", background:f.outOfStock?"#ef4444":f.priceUp?"#f59e0b":"#10b981", flexShrink:0 }}),
                                    e("span", { style:{ flex:1, fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.85)" }}, f.name),
                                    // price up badge on flavor
                                    f.priceUp && e("span", { style:{ fontSize:10, fontWeight:700, color:"#fbbf24", background:"rgba(245,158,11,0.15)", border:"1px solid rgba(245,158,11,0.3)", borderRadius:6, padding:"1px 6px" }}, "↑ Price Up"),
                                    e("input", { type:"number", value:f.quantity, onChange:ev=>setFlavorQty(f.name,ev.target.value), style:{ width:55, padding:"4px 6px", borderRadius:7, border:"1px solid rgba(255,255,255,0.1)", fontSize:13, textAlign:"center", outline:"none", background:"rgba(255,255,255,0.06)", color:"white" }}),
                                    e("button", { onClick:()=>toggleFlavorStock(f.name), title:f.outOfStock?"Mark in stock":"Mark finished", style:{ background:f.outOfStock?"rgba(16,185,129,0.15)":"rgba(239,68,68,0.15)", border:"none", borderRadius:7, width:28, height:28, cursor:"pointer", fontSize:13, flexShrink:0 }}, f.outOfStock?"✅":"🔴"),
                                    e("button", { onClick:()=>toggleFlavor(f.name), title:"Remove", style:{ background:"rgba(239,68,68,0.15)", border:"none", borderRadius:7, width:28, height:28, cursor:"pointer", color:"#f87171", fontWeight:700, fontSize:14, flexShrink:0 }}, "✕")
                                ),
                                // ── NEW: per-flavor price increase toggle
                                e("button", {
                                    onClick:()=>toggleFlavorPriceUp(f.name),
                                    style:{
                                        marginTop:6, width:"100%", padding:"6px 10px", borderRadius:8, border:`1px solid ${f.priceUp?"rgba(245,158,11,0.4)":"rgba(255,255,255,0.08)"}`,
                                        background:f.priceUp?"rgba(245,158,11,0.12)":"rgba(255,255,255,0.04)",
                                        color:f.priceUp?"#fbbf24":"rgba(255,255,255,0.4)",
                                        fontWeight:700, fontSize:12, cursor:"pointer", textAlign:"left",
                                        display:"flex", alignItems:"center", gap:6
                                    }
                                },
                                    e("span", null, f.priceUp ? "💰 Price increased — tap to remove flag" : "💰 Flag this flavor's price went up")
                                )
                            ))
                        )
                    ),

                    e("input", { value:flavorSearch, onChange:ev=>setFlavorSearch(ev.target.value), placeholder:"🔍  Search flavors to add...", style:{ ...S.input, marginBottom:8 }}),
                    e("div", { style:{ display:"flex", flexWrap:"wrap", gap:6 }},
                        visibleFlavors.map(f => {
                            const sel = selectedNames.includes(f);
                            return e("button", { key:f, onClick:()=>toggleFlavor(f), style:{ padding:"6px 12px", borderRadius:999, fontSize:12, fontWeight:600, cursor:"pointer", border:`1px solid ${sel?"#f59e0b":"rgba(255,255,255,0.1)"}`, background:sel?"rgba(245,158,11,0.15)":"rgba(255,255,255,0.04)", color:sel?"#fbbf24":"rgba(255,255,255,0.55)", transition:"all 0.15s" }}, (sel?"✓ ":"")+f);
                        })
                    )
                ),

                e("div", { style:{ display:"flex", gap:10 }},
                    e("button", { onClick:onClose, style:{ flex:1, padding:14, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontSize:14, fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)" }}, "Cancel"),
                    e("button", { onClick:()=>onSubmit(form), style:{ flex:2, padding:14, borderRadius:12, border:"none", background:"linear-gradient(135deg,#f59e0b,#f97316)", fontSize:14, fontWeight:800, cursor:"pointer", color:"#1a1a2e" }}, isAdd ? "Add Item" : "Save Changes")
                )
            )
        );
    }

    // ── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
        const [items,         setItems]         = useState([]);
        const [flavors,       setFlavors]       = useState(DEFAULT_FLAVORS);
        const [loading,       setLoading]       = useState(true);
        const [search,        setSearch]        = useState("");
        const [filter,        setFilter]        = useState("all");
        const [modal,         setModal]         = useState(null);
        const [toast,         setToast]         = useState(null);
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const [showFlavorMgr, setShowFlavorMgr] = useState(false);
        const [expandedId,    setExpandedId]    = useState(null);

        useEffect(() => {
            if (!db) { setLoading(false); return; }
            const itemsRef = db.ref("items");
            itemsRef.on("value", snap => {
                const val = snap.val();
                if (val) {
                    const arr = Object.entries(val).map(([key, item]) => ({ ...item, id: key }));
                    arr.sort((a, b) => (b.createdAt||0) - (a.createdAt||0));
                    setItems(arr);
                } else { setItems([]); }
                setLoading(false);
            });
            const flavorsRef = db.ref("flavors");
            flavorsRef.on("value", snap => { const val = snap.val(); if (val) setFlavors(val); });
            return () => { itemsRef.off(); flavorsRef.off(); };
        }, []);

        function showToast(msg) { setToast(msg); setTimeout(()=>setToast(null), 3000); }
        function writeFailed(err) {
            showToast(err && /permission/i.test(err.code || err.message || "")
                ? "⛔ Not allowed — please log in again"
                : "⚠️ Save failed — check your connection");
        }

        function handleSubmit(form) {
            if (!form.name.trim()) return showToast("⚠️ Item name is required");
            const isBoth = form.saleType === "Both";
            const qty    = isBoth && form.quantity === "" ? 0 : parseInt(form.quantity);
            const boxQty = form.boxQuantity === "" ? 0 : parseInt(form.boxQuantity);
            if (isNaN(qty) || qty < 0) return showToast("⚠️ Enter a valid quantity");
            if (isBoth && (isNaN(boxQty) || boxQty < 0)) return showToast("⚠️ Enter a valid box quantity");
            const base = {
                name:       form.name.trim(),
                category:   form.category.trim(),
                quantity:   qty,
                sellPrice:  form.sellPrice ? parseFloat(form.sellPrice) : null,
                costPrice:  form.costPrice ? parseFloat(form.costPrice) : null,
                // box stock/prices only used when sold as "Both" (a "Box"-only item uses the fields above)
                boxQuantity:  isBoth ? boxQty : null,
                boxSellPrice: isBoth && form.boxSellPrice ? parseFloat(form.boxSellPrice) : null,
                boxCostPrice: isBoth && form.boxCostPrice ? parseFloat(form.boxCostPrice) : null,
                unitsPerBox:  form.saleType !== "Loose" && form.unitsPerBox ? parseInt(form.unitsPerBox) : null,
                priceUp:    form.priceUp,
                saleType:   form.saleType || "Loose",
                outOfStock: isBoth ? (qty === 0 && boxQty === 0) : qty === 0,
                flavors:    form.flavors.length > 0 ? form.flavors : null,
            };
            if (!db) return showToast("⚠️ No database — upload to GitHub first");
            if (modal === "add") {
                db.ref("items").push({ ...base, createdAt: Date.now() }).catch(writeFailed);
                showToast(`✅ "${base.name}" added`);
            } else {
                db.ref("items/" + modal.item.id).update(base).catch(writeFailed);
                showToast(`✏️ "${base.name}" updated`);
            }
            setModal(null);
        }

        function toggleOutOfStock(item) {
            if (!db) return;
            const nowOos = !item.outOfStock;
            db.ref("items/" + item.id).update({
                outOfStock: nowOos,
                quantity: nowOos ? 0 : item.quantity,
                ...(item.saleType === "Both" && nowOos ? { boxQuantity: 0 } : {}),
            }).catch(writeFailed);
            showToast(nowOos ? `🔴 "${item.name}" marked finished` : `🟢 "${item.name}" back in stock`);
        }

        function doDelete() {
            if (!deleteConfirm || !db) return;
            db.ref("items/" + deleteConfirm.id).remove().catch(writeFailed);
            showToast(`🗑️ "${deleteConfirm.name}" deleted`);
            setDeleteConfirm(null);
        }

        function saveFlavorsHandler(list) {
            if (!db) return;
            db.ref("flavors").set(list).catch(writeFailed);
            showToast("✅ Flavor list updated");
        }

        const filtered = items.filter(item => {
            const m = item.name.toLowerCase().includes(search.toLowerCase()) ||
                      (item.category||"").toLowerCase().includes(search.toLowerCase());
            if (!m) return false;
            if (filter==="instock")  return !item.outOfStock;
            if (filter==="finished") return  item.outOfStock;
            if (filter==="low")      return  isLowStock(item);
            if (filter==="priceup")  return  item.priceUp;
            return true;
        });

        const stats = {
            total:    items.length,
            inStock:  items.filter(i=>!i.outOfStock).length,
            low:      items.filter(isLowStock).length,
            finished: items.filter(i=> i.outOfStock).length,
        };

        return e("div", { style:{ minHeight:"100vh", background:"transparent", fontFamily:"'Inter',Arial,sans-serif", paddingBottom:80 }},

            // ── HEADER ────────────────────────────────────────────────────
            e("div", { style:{ background:"rgba(22,22,31,0.95)", backdropFilter:"blur(20px)", borderBottom:"1px solid rgba(255,255,255,0.06)", padding:"16px 20px", position:"sticky", top:0, zIndex:100 }},
                e("div", { style:{ maxWidth:720, margin:"0 auto" }},
                    e("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }},

                        // LEFT: logo
                        e("div", { style:{ display:"flex", alignItems:"center", gap:10, minWidth:0 }},
                            // logo + name
                            e("div", { style:{ display:"flex", alignItems:"center", gap:10 }},
                                e("div", { style:{ width:36, height:36, background:"linear-gradient(135deg,#f59e0b,#ef4444)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, boxShadow:"0 4px 12px rgba(245,158,11,0.3)", flexShrink:0 }}, "🛒"),
                                e("div", null,
                                    e("div", { style:{ fontSize: canEdit ? 13 : 14, fontWeight:900, color:"white", letterSpacing:"-0.3px", lineHeight:1.2 }}, "SANKA CASH AND CARRY"),
                                    e("div", { style:{ fontSize:10, fontWeight:500, color:canEdit?"rgba(245,158,11,0.8)":"rgba(52,211,153,0.7)", marginTop:1 }},
                                        canEdit ? "✏️ Editor Mode" : "🟢 Live Stock Catalogue"
                                    )
                                )
                            )
                        ),

                        // RIGHT: staff login (customers) or editor actions + log out
                        canEdit
                            ? e("div", { style:{ display:"flex", gap:7 }},
                                e("button", { onClick:()=>setShowFlavorMgr(true), title:"Manage flavors", style:{ background:"rgba(255,255,255,0.06)", color:"rgba(255,255,255,0.7)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, padding:"8px 12px", fontWeight:700, fontSize:11, cursor:"pointer" }}, "🎨"),
                                e("button", { onClick:()=>setModal("add"), style:{ background:"linear-gradient(135deg,#f59e0b,#f97316)", color:"#1a1a2e", border:"none", borderRadius:10, padding:"8px 14px", fontWeight:800, fontSize:12, cursor:"pointer", boxShadow:"0 4px 12px rgba(245,158,11,0.25)" }}, "+ Add"),
                                e("button", { onClick:()=>{ if (window.confirm("Log out of editor mode?")) logout(); }, title:"Log out", style:{ background:"rgba(239,68,68,0.1)", color:"#f87171", border:"1px solid rgba(239,68,68,0.25)", borderRadius:10, padding:"8px 12px", fontWeight:700, fontSize:12, cursor:"pointer" }}, "⎋")
                              )
                            : e("button", { onClick:openLogin, title:"Staff login", style:{ background:"rgba(255,255,255,0.06)", color:"rgba(255,255,255,0.75)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:999, padding:"8px 14px", fontWeight:700, fontSize:12, cursor:"pointer", whiteSpace:"nowrap", flexShrink:0, fontFamily:"'Inter',Arial,sans-serif" }}, "🔒 Staff login")
                    ),

                    // stats row
                    e("div", { style:{ display:"flex", gap:7, flexWrap:"wrap" }},
                        [{label:"Total",value:stats.total,color:"rgba(255,255,255,0.5)"},{label:"In Stock",value:stats.inStock,color:"#34d399"},{label:"Running Low",value:stats.low,color:"#facc15"},{label:"Finished",value:stats.finished,color:"#f87171"}]
                        .map(s => e("div", { key:s.label, style:{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10, padding:"6px 12px", display:"flex", gap:7, alignItems:"center" }},
                            e("span", { style:{ fontSize:16, fontWeight:900, color:s.color }}, s.value),
                            e("span", { style:{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:600 }}, s.label)
                        ))
                    )
                )
            ),

            // ── SEARCH + FILTER + LIST ─────────────────────────────────────
            e("div", { style:{ maxWidth:720, margin:"0 auto", padding:"18px 14px 0" }},
                e("div", { style:{ display:"flex", gap:9, marginBottom:14, flexWrap:"wrap" }},
                    e("input", { value:search, onChange:ev=>setSearch(ev.target.value), placeholder:"🔍  Search items or categories...", style:{ flex:1, minWidth:160, padding:"11px 14px", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)", fontSize:14, background:"rgba(255,255,255,0.05)", color:"white", outline:"none", fontFamily:"'Inter',Arial,sans-serif" }}),
                    e("select", { value:filter, onChange:ev=>setFilter(ev.target.value), style:{ padding:"11px 12px", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)", fontSize:12, background:"#1a1a24", color:"rgba(255,255,255,0.7)", cursor:"pointer", outline:"none", fontFamily:"'Inter',Arial,sans-serif" }},
                        e("option",{value:"all"},"All Items"),
                        e("option",{value:"instock"},"In Stock"),
                        e("option",{value:"low"},"Running Low (under 10)"),
                        e("option",{value:"finished"},"Finished"),
                        e("option",{value:"priceup"},"Price Increased")
                    )
                ),

                loading && e("div", { style:{ textAlign:"center", padding:"60px 20px", color:"rgba(255,255,255,0.3)" }},
                    e("div", { style:{ fontSize:36, marginBottom:12 }}, "⏳"),
                    e("div", { style:{ fontSize:14, fontWeight:600 }}, "Loading live stock...")
                ),

                !loading && filtered.length===0 && e("div", { style:{ textAlign:"center", padding:"80px 20px" }},
                    e("div", { style:{ fontSize:52, marginBottom:14, opacity:0.5 }}, "📦"),
                    e("div", { style:{ fontSize:16, fontWeight:700, color:"rgba(255,255,255,0.3)" }}, "No items found"),
                    e("div", { style:{ fontSize:13, marginTop:6, color:"rgba(255,255,255,0.2)" }},
                        items.length===0 ? (canEdit?"Tap '+ Add' to get started":"No stock has been added yet") : "Try a different search or filter"
                    )
                ),

                !loading && filtered.length>0 && e("div", { style:{ display:"flex", flexDirection:"column", gap:8 }},
                    filtered.map(item => {
                        const isExpanded     = expandedId === item.id;
                        const hasFlavors     = item.flavors && item.flavors.length > 0;
                        const availCount     = hasFlavors ? item.flavors.filter(f=>!f.outOfStock).length : 0;
                        const finishedCount  = hasFlavors ? item.flavors.filter(f=>f.outOfStock).length : 0;
                        const priceUpFlavors = hasFlavors ? item.flavors.filter(f=>f.priceUp).length : 0;
                        const hasPartialFlavorWarn = !item.outOfStock && hasFlavors && finishedCount > 0;

                        // each way the item is sold gets its own chip (qty + price) on the same card
                        const units = getUnits(item);
                        // red = finished (whole item, a loose/box unit, or a flavor); yellow = under 10 left
                        const partFinished = !item.outOfStock && (hasPartialFlavorWarn || units.some(u => u.qty === 0));
                        const low = isLowStock(item);

                        // liquid glass card: red = finished/missing, yellow = running low, green = in stock
                        const cardClass = "glass-card " + ((item.outOfStock || partFinished) ? "glass-red" : low ? "glass-yellow" : "glass-green");

                        const dotColor  = (item.outOfStock || partFinished) ? "#ef4444" : low ? "#facc15" : "#10b981";
                        const dotShadow = (item.outOfStock || partFinished) ? "rgba(239,68,68,0.18)" : low ? "rgba(250,204,21,0.2)" : "rgba(16,185,129,0.15)";

                        return e("div", { key:item.id, className:cardClass },
                            e("div", { style:{ padding:"13px 14px", display:"flex", alignItems:"center", gap:11 }},
                                // dot
                                e("div", { style:{ width:10, height:10, borderRadius:"50%", background:dotColor, flexShrink:0, boxShadow:`0 0 0 3px ${dotShadow}` }}),

                                // info
                                e("div", { style:{ flex:1, minWidth:0 }},
                                    e("div", { style:{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap", marginBottom:5 }},
                                        e("span", { style:{ fontWeight:700, fontSize:15, color:item.outOfStock?"rgba(255,255,255,0.35)":"white", textDecoration:item.outOfStock?"line-through":"none", letterSpacing:"-0.2px" }}, item.name),
                                        item.priceUp    && e(Badge,{color:"orange"}, "Price ↑"),
                                        item.outOfStock && e(Badge,{color:"red"},    "Finished"),
                                        hasPartialFlavorWarn && e(Badge,{color:"red"}, `${finishedCount} flavor${finishedCount>1?"s":""} finished`),
                                        low && e(Badge,{color:"yellow"}, "Running low"),
                                        priceUpFlavors > 0 && e(Badge,{color:"orange"}, `💰 ${priceUpFlavors} flavor${priceUpFlavors>1?"s":""} price ↑`)
                                    ),
                                    e("div", { style:{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }},
                                        item.category && e("span", { style:{ fontSize:11, color:"rgba(255,255,255,0.35)", fontWeight:500 }}, "📁 "+item.category),
                                        hasFlavors && e("button", { onClick:()=>setExpandedId(isExpanded?null:item.id), style:{ background:"rgba(99,102,241,0.12)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:999, padding:"2px 9px", fontSize:10, fontWeight:700, color:"#a5b4fc", cursor:"pointer" }}, `🎨 ${availCount}/${item.flavors.length} ${isExpanded?"▲":"▼"}`)
                                    ),
                                    // loose / box chips — separate qty & price, side by side
                                    e("div", { style:{ display:"flex", gap:6, flexWrap:"wrap", marginTop:7 }},
                                        units.map(u => {
                                            const done  = u.qty === 0;
                                            const uLow  = isLowQty(u.qty);
                                            const m     = calcMargin(u.sell, u.cost);
                                            const bg     = done ? "rgba(239,68,68,0.1)"  : uLow ? "rgba(250,204,21,0.1)"  : `${u.accent}14`;
                                            const border = done ? "rgba(239,68,68,0.35)" : uLow ? "rgba(250,204,21,0.35)" : u.accent+"40";
                                            return e("div", { key:u.key, style:{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap", background:bg, border:`1px solid ${border}`, borderRadius:10, padding:"5px 10px" }},
                                                e("span", { style:{ fontSize:11, fontWeight:800, color:done?"#f87171":uLow?"#facc15":u.accent }}, u.label + (u.per ? ` ×${u.per}` : "")),
                                                e("span", { style:{ fontSize:11, fontWeight:(done||uLow)?700:500, color:done?"#f87171":uLow?"#fde047":"rgba(255,255,255,0.55)" }}, done ? "Finished" : `Qty ${u.qty}${uLow?" ⚠️":""}`),
                                                // sell price — visible to all
                                                u.sell != null && e("span", { style:{ fontSize:12, fontWeight:800, color:"#34d399" }}, "R"+u.sell.toFixed(2)),
                                                // cost + margin — editors only
                                                canEdit && u.cost != null && e("span", { style:{ fontSize:10, fontWeight:700, color:"#a5b4fc" }}, "cost R"+u.cost.toFixed(2)),
                                                canEdit && m && e("span", { style:{ fontSize:10, fontWeight:700, color:parseFloat(m)>=20?"#34d399":"#fbbf24" }}, m+"%")
                                            );
                                        })
                                    )
                                ),

                                // action buttons — editors only
                                canEdit && e("div", { style:{ display:"flex", gap:5, flexShrink:0 }},
                                    e(Btn, { onClick:()=>toggleOutOfStock(item), title:item.outOfStock?"Mark in stock":"Mark finished", style:{ background:item.outOfStock?"rgba(16,185,129,0.15)":"rgba(239,68,68,0.15)" }}, item.outOfStock?"✅":"🔴"),
                                    e(Btn, { onClick:()=>setModal({type:"edit",item}), title:"Edit", style:{ background:"rgba(99,102,241,0.15)" }}, "✏️"),
                                    e(Btn, { onClick:()=>setDeleteConfirm(item), title:"Delete", style:{ background:"rgba(239,68,68,0.1)" }}, "🗑️")
                                )
                            ),

                            // flavor expand panel
                            isExpanded && hasFlavors && e("div", { style:{ borderTop:"1px solid rgba(255,255,255,0.06)", padding:"12px 14px 14px", background:"rgba(0,0,0,0.2)" }},
                                e("div", { style:{ fontSize:10, fontWeight:700, color:"rgba(255,255,255,0.3)", marginBottom:8, letterSpacing:"0.08em", textTransform:"uppercase" }}, "Flavors"),
                                e("div", { style:{ display:"flex", flexWrap:"wrap", gap:6 }},
                                    item.flavors.map(f => {
                                        // red = finished, yellow = under 10 left, orange = price up, green = fine
                                        const c = f.outOfStock          ? { bg:"rgba(239,68,68,0.12)",  bd:"rgba(239,68,68,0.3)",   dot:"#ef4444", tx:"#f87171", sub:"rgba(248,113,113,0.75)" }
                                                : isLowQty(f.quantity) ? { bg:"rgba(250,204,21,0.12)", bd:"rgba(250,204,21,0.35)", dot:"#facc15", tx:"#fde047", sub:"rgba(253,224,71,0.75)" }
                                                : f.priceUp            ? { bg:"rgba(249,115,22,0.12)", bd:"rgba(249,115,22,0.35)", dot:"#f97316", tx:"#fb923c", sub:"rgba(251,146,60,0.8)" }
                                                :                        { bg:"rgba(16,185,129,0.12)", bd:"rgba(16,185,129,0.2)",  dot:"#10b981", tx:"#34d399", sub:"rgba(52,211,153,0.7)" };
                                        return e("div", { key:f.name, style:{ display:"flex", alignItems:"center", gap:5, background:c.bg, border:`1px solid ${c.bd}`, borderRadius:999, padding:"4px 11px" }},
                                            e("div", { style:{ width:6, height:6, borderRadius:"50%", background:c.dot, flexShrink:0 }}),
                                            e("span", { style:{ fontSize:12, fontWeight:700, color:c.tx }}, f.name),
                                            e("span", { style:{ fontSize:10, fontWeight:600, color:c.sub }},
                                                f.outOfStock ? "· Finished" : `· ${f.quantity} left${f.priceUp ? " · Price ↑" : ""}`
                                            )
                                        );
                                    })
                                )
                            )
                        );
                    })
                )
            ),

            // MODALS
            modal         && e(ItemModal,     { modal, flavors, onClose:()=>setModal(null), onSubmit:handleSubmit }),
            showFlavorMgr && e(FlavorManager, { flavors, onClose:()=>setShowFlavorMgr(false), onSave:saveFlavorsHandler }),

            // DELETE CONFIRM
            deleteConfirm && e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:20, backdropFilter:"blur(4px)" }},
                e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:20, padding:28, maxWidth:320, width:"100%", textAlign:"center" }},
                    e("div", { style:{ fontSize:42, marginBottom:12 }}, "🗑️"),
                    e("div", { style:{ fontWeight:800, fontSize:17, marginBottom:8, color:"white" }}, "Delete Item?"),
                    e("div", { style:{ color:"rgba(255,255,255,0.4)", fontSize:14, marginBottom:24 }}, `"${deleteConfirm.name}" will be permanently removed.`),
                    e("div", { style:{ display:"flex", gap:10 }},
                        e("button", { onClick:()=>setDeleteConfirm(null), style:{ flex:1, padding:13, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)", fontSize:14 }}, "Cancel"),
                        e("button", { onClick:doDelete, style:{ flex:1, padding:13, borderRadius:12, border:"none", background:"linear-gradient(135deg,#ef4444,#dc2626)", color:"white", fontWeight:800, cursor:"pointer", fontSize:14 }}, "Delete")
                    )
                )
            ),

            // TOAST
            toast && e("div", { style:{ position:"fixed", bottom:28, left:"50%", transform:"translateX(-50%)", background:"rgba(22,22,31,0.95)", backdropFilter:"blur(12px)", border:"1px solid rgba(255,255,255,0.1)", color:"white", padding:"13px 24px", borderRadius:14, fontWeight:600, fontSize:13, boxShadow:"0 8px 32px rgba(0,0,0,0.4)", zIndex:400, whiteSpace:"nowrap" }}, toast)
        );
    }

    ReactDOM.render(React.createElement(App), document.getElementById("inventory-root"));
}

// show the customer catalogue straight away
mountInventory(false);
</script>
</body>
</html>
