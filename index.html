<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanka Cash & Carry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', Arial, sans-serif; background: #0f0f13; min-height: 100vh; }

        #login-gate {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0f0f13 70%);
        }
        .login-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 48px 40px; border-radius: 24px;
            text-align: center; width: 340px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }
        .login-logo {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(245,158,11,0.3);
        }
        .login-box h2 { color: white; font-size: 20px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
        /* Somali flag circle */
        .somali-flag {
            width: 32px; height: 32px; border-radius: 50%;
            background: #4189DD;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 2px 10px rgba(65,137,221,0.4);
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.15);
        }
        .login-subtitle { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 28px; }
        #pass-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; font-size: 15px;
            margin-bottom: 12px; outline: none;
            color: white; box-sizing: border-box;
            transition: border-color 0.2s;
            font-family: 'Inter', Arial, sans-serif;
        }
        #pass-field::placeholder { color: rgba(255,255,255,0.3); }
        #pass-field:focus { border-color: rgba(245,158,11,0.6); background: rgba(255,255,255,0.09); }
        #login-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #1a1a2e; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            box-shadow: 0 4px 16px rgba(245,158,11,0.35);
            transition: opacity 0.2s, transform 0.1s;
        }
        #login-btn:hover { opacity: 0.92; transform: translateY(-1px); }
        #login-btn:active { transform: translateY(0); }
        .view-only-btn {
            width: 100%; padding: 14px; margin-top: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            box-shadow: 0 4px 16px rgba(16,185,129,0.35);
            transition: opacity 0.2s, transform 0.1s;
        }
        .view-only-btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .view-only-btn:active { transform: translateY(0); }
        #error-msg { display: none; color: #f87171; margin-top: 12px; font-size: 13px; font-weight: 500; }
        #content { display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
</head>
<body>

<div id="login-gate">
    <div class="login-box">
        <div class="login-logo">🛒</div>
        <h2>SANKA CASH AND CARRY</h2>
        <!-- Somali flag icon: blue circle + white star -->
        <div class="somali-flag">★</div>
        <p class="login-subtitle">Inventory Management</p>
        <input type="password" id="pass-field" placeholder="Staff password to edit" />
        <button id="login-btn">✏️ Edit Dashboard</button>
        <button class="view-only-btn" id="view-btn">👁 View Stock Only</button>
        <p id="error-msg">❌ Incorrect password. Try again.</p>
    </div>
</div>

<div id="content">
    <div id="inventory-root"></div>
</div>

<script>
// ─── FIREBASE ─────────────────────────────────────────────────────────────────
try { firebase.initializeApp({ databaseURL: "https://sanka-stock-default-rtdb.firebaseio.com" }); } catch(e) {}
const db = (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) ? firebase.database() : null;

// ─── BACK BUTTON TRAP ─────────────────────────────────────────────────────────
// Push a fake history state so Android back button doesn't exit the app
history.pushState({ page: "app" }, "", window.location.href);
window.addEventListener("popstate", function(e) {
    // Re-push so back button never actually goes back
    history.pushState({ page: "app" }, "", window.location.href);
});

// ─── PASSWORD ─────────────────────────────────────────────────────────────────
const SECURE_HASH = "d92d0652aad7fad980ec195f529f5500012a6bb12f724a5c3a7b180c80d6cda6";
let isEditor = false;

async function validate() {
    const input = document.getElementById("pass-field").value.trim();
    const errMsg = document.getElementById("error-msg");
    if (!input) return;
    const encoded = new TextEncoder().encode(input);
    const hashBuffer = await crypto.subtle.digest("SHA-256", encoded);
    const inputHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
    if (inputHash === SECURE_HASH) {
        isEditor = true; launchApp();
    } else {
        errMsg.style.display = "block";
        document.getElementById("pass-field").value = "";
    }
}
function launchApp() {
    document.getElementById("login-gate").style.display = "none";
    document.getElementById("content").style.display = "block";
    mountInventory(isEditor);
}
document.getElementById("login-btn").addEventListener("click", validate);
document.getElementById("view-btn").addEventListener("click", () => { isEditor = false; launchApp(); });
document.getElementById("pass-field").addEventListener("keypress", e => { if (e.key === "Enter") validate(); });

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const DEFAULT_FLAVORS = [
    "Durban Curry","Chicken","Beef","Original","Cheese",
    "BBQ","Tomato","Spicy","Plain","Strawberry",
    "Bubblegum","Cola","Lemon","Grape","Watermelon"
];

// Sale type options
const SALE_TYPES = ["Loose", "Box", "Both"];

const S = {
    card:           { background:"#1a1a24", border:"1px solid rgba(255,255,255,0.08)", borderRadius:16, overflow:"hidden" },
    cardWarn:       { background:"#1e1015", border:"1px solid rgba(239,68,68,0.25)",   borderRadius:16, overflow:"hidden" },
    cardPrice:      { background:"#1a1a10", border:"1px solid rgba(253,211,77,0.2)",   borderRadius:16, overflow:"hidden" },
    cardFlavorWarn: { background:"#1a1508", border:"1px solid rgba(251,191,36,0.35)",  borderRadius:16, overflow:"hidden" },
    input:  { width:"100%", padding:"11px 14px", borderRadius:10, border:"1px solid rgba(255,255,255,0.1)", fontSize:14, outline:"none", boxSizing:"border-box", background:"rgba(255,255,255,0.05)", color:"white", fontFamily:"'Inter',Arial,sans-serif" },
    label:  { fontSize:11, fontWeight:700, color:"rgba(255,255,255,0.4)", display:"block", marginBottom:5, letterSpacing:"0.06em", textTransform:"uppercase" },
};

// ─── MOUNT ────────────────────────────────────────────────────────────────────
function mountInventory(canEdit) {
    const { useState, useEffect } = React;
    const e = React.createElement;

    // ── BADGE ────────────────────────────────────────────────────────────────
    function Badge({ children, color }) {
        const p = {
            green:  { background:"rgba(16,185,129,0.15)",  color:"#34d399", border:"1px solid rgba(16,185,129,0.2)" },
            red:    { background:"rgba(239,68,68,0.15)",   color:"#f87171", border:"1px solid rgba(239,68,68,0.2)" },
            orange: { background:"rgba(245,158,11,0.15)",  color:"#fbbf24", border:"1px solid rgba(245,158,11,0.2)" },
            amber:  { background:"rgba(251,191,36,0.18)",  color:"#fde68a", border:"1px solid rgba(251,191,36,0.35)" },
            indigo: { background:"rgba(99,102,241,0.15)",  color:"#a5b4fc", border:"1px solid rgba(99,102,241,0.2)" },
            blue:   { background:"rgba(59,130,246,0.15)",  color:"#93c5fd", border:"1px solid rgba(59,130,246,0.2)" },
            pink:   { background:"rgba(236,72,153,0.15)",  color:"#f9a8d4", border:"1px solid rgba(236,72,153,0.2)" },
        };
        return e("span", { style:{ ...(p[color]||p.indigo), padding:"2px 9px", borderRadius:999, fontSize:11, fontWeight:700, whiteSpace:"nowrap" }}, children);
    }

    // ── ICON BUTTON ──────────────────────────────────────────────────────────
    function Btn({ onClick, style, children, title }) {
        return e("button", { onClick, title, style:{ border:"none", borderRadius:9, width:32, height:32, cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, ...style }}, children);
    }

    // ── INPUT FIELD ──────────────────────────────────────────────────────────
    function InputField({ label, value, onChange, placeholder, type="text", prefix }) {
        return e("div", { style:{ marginBottom:14 }},
            e("label", { style:S.label }, label),
            e("div", { style:{ position:"relative" }},
                prefix && e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"rgba(255,255,255,0.3)", fontSize:13, fontWeight:600 }}, prefix),
                e("input", { type, value, onChange, placeholder, style:{ ...S.input, paddingLeft: prefix ? 28 : 14 }})
            )
        );
    }

    // ── TOGGLE ROW ───────────────────────────────────────────────────────────
    function ToggleRow({ on, onClick, label, sub, color }) {
        const activeColor = color || "#f59e0b";
        const activeBg    = color ? `${color}18` : "rgba(245,158,11,0.08)";
        const activeBorder= color ? `${color}50` : "rgba(245,158,11,0.3)";
        return e("div", { onClick, style:{ display:"flex", alignItems:"center", gap:14, background:on?activeBg:"rgba(255,255,255,0.03)", border:`1px solid ${on?activeBorder:"rgba(255,255,255,0.08)"}`, borderRadius:12, padding:"13px 16px", marginBottom:12, cursor:"pointer" }},
            e("div", { style:{ width:42, height:24, borderRadius:12, background:on?activeColor:"rgba(255,255,255,0.1)", position:"relative", flexShrink:0, transition:"background 0.2s" }},
                e("div", { style:{ position:"absolute", top:3, left:on?21:3, width:18, height:18, borderRadius:"50%", background:"white", transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.3)" }})
            ),
            e("div", null,
                e("div", { style:{ fontWeight:700, fontSize:14, color:"white" }}, label),
                e("div", { style:{ fontSize:12, color:"rgba(255,255,255,0.4)" }}, sub)
            )
        );
    }

    // ── FLAVOR MANAGER ───────────────────────────────────────────────────────
    function FlavorManager({ flavors, onClose, onSave }) {
        const [list, setList]     = useState([...flavors]);
        const [newFl, setNewFl]   = useState("");
        const [search, setSearch] = useState("");
        const filtered = list.filter(f => f.toLowerCase().includes(search.toLowerCase()));

        function add() {
            const t = newFl.trim();
            if (!t || list.map(f=>f.toLowerCase()).includes(t.toLowerCase())) { setNewFl(""); return; }
            setList([...list, t]); setNewFl("");
        }

        return e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:300, backdropFilter:"blur(4px)" }, onClick:ev=>{ if(ev.target===ev.currentTarget) onClose(); }},
            e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"24px 24px 0 0", padding:"28px 24px 48px", width:"100%", maxWidth:520, maxHeight:"80vh", overflowY:"auto" }},
                e("div", { style:{ width:36, height:4, background:"rgba(255,255,255,0.15)", borderRadius:2, margin:"0 auto 24px" }}),
                e("div", { style:{ fontWeight:800, fontSize:18, marginBottom:6, color:"white" }}, "🎨 Manage Flavors"),
                e("div", { style:{ fontSize:13, color:"rgba(255,255,255,0.4)", marginBottom:20 }}, "Add or remove flavors across all items."),
                e("div", { style:{ display:"flex", gap:8, marginBottom:12 }},
                    e("input", { value:newFl, onChange:ev=>setNewFl(ev.target.value), onKeyDown:ev=>{ if(ev.key==="Enter") add(); }, placeholder:"New flavor name...", style:{ ...S.input, flex:1 }}),
                    e("button", { onClick:add, style:{ padding:"11px 18px", borderRadius:10, background:"linear-gradient(135deg,#f59e0b,#f97316)", color:"#1a1a2e", border:"none", fontWeight:800, cursor:"pointer", fontSize:13 }}, "Add")
                ),
                e("div", { style:{ position:"relative", marginBottom:10 }},
                    e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:14, pointerEvents:"none" }}, "🔍"),
                    e("input", { value:search, onChange:ev=>setSearch(ev.target.value), placeholder:"Search flavors...", style:{ ...S.input, paddingLeft:36 }})
                ),
                e("div", { style:{ fontSize:11, color:"rgba(255,255,255,0.3)", fontWeight:600, marginBottom:10 }},
                    filtered.length===list.length ? `${list.length} flavor${list.length!==1?"s":""}` : `${filtered.length} of ${list.length} flavors`
                ),
                e("div", { style:{ display:"flex", flexDirection:"column", gap:6, marginBottom:28 }},
                    filtered.length===0
                        ? e("div", { style:{ textAlign:"center", padding:"20px 0", color:"rgba(255,255,255,0.2)", fontSize:13 }}, "No flavors match")
                        : filtered.map(f => e("div", { key:f, style:{ display:"flex", justifyContent:"space-between", alignItems:"center", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:10, padding:"10px 14px" }},
                            e("span", { style:{ fontSize:14, fontWeight:600, color:"rgba(255,255,255,0.85)" }}, f),
                            e("button", { onClick:()=>setList(list.filter(x=>x!==f)), style:{ background:"rgba(239,68,68,0.15)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:7, padding:"4px 12px", color:"#f87171", fontWeight:700, cursor:"pointer", fontSize:12 }}, "Remove")
                        ))
                ),
                e("div", { style:{ display:"flex", gap:10 }},
                    e("button", { onClick:onClose, style:{ flex:1, padding:14, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontSize:14, fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)" }}, "Cancel"),
                    e("button", { onClick:()=>{ onSave(list); onClose(); }, style:{ flex:2, padding:14, borderRadius:12, border:"none", background:"linear-gradient(135deg,#f59e0b,#f97316)", fontSize:14, fontWeight:800, cursor:"pointer", color:"#1a1a2e" }}, "Save Flavors")
                )
            )
        );
    }

    // ── ITEM MODAL ───────────────────────────────────────────────────────────
    function ItemModal({ modal, flavors, onClose, onSubmit }) {
        const isAdd = modal === "add";
        const [form, setForm] = useState(isAdd
            ? { name:"", category:"", quantity:"", sellPrice:"", costPrice:"", priceUp:false, saleType:"Loose", flavors:[] }
            : {
                name:      modal.item.name,
                category:  modal.item.category  || "",
                quantity:  String(modal.item.quantity),
                sellPrice: modal.item.sellPrice  != null ? String(modal.item.sellPrice) : "",
                costPrice: modal.item.costPrice  != null ? String(modal.item.costPrice) : "",
                priceUp:   modal.item.priceUp    || false,
                saleType:  modal.item.saleType   || "Loose",
                flavors:   modal.item.flavors    ? modal.item.flavors.map(f=>({...f})) : [],
            }
        );
        const [flavorSearch, setFlavorSearch] = useState("");
        const sellF = parseFloat(form.sellPrice), costF = parseFloat(form.costPrice);
        const margin = (sellF && costF) ? ((sellF - costF) / sellF * 100).toFixed(1) : null;
        const selectedNames  = form.flavors.map(f => f.name);
        const visibleFlavors = flavors.filter(f => f.toLowerCase().includes(flavorSearch.toLowerCase()));

        function toggleFlavor(name) {
            const exists = form.flavors.find(f=>f.name===name);
            setForm({ ...form, flavors: exists
                ? form.flavors.filter(f=>f.name!==name)
                : [...form.flavors, { name, quantity:0, outOfStock:false, priceUp:false }]
            });
        }
        function setFlavorQty(name, val) {
            const qty = Math.max(0, parseInt(val)||0);
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,quantity:qty,outOfStock:qty===0}:f) });
        }
        function toggleFlavorStock(name) {
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,outOfStock:!f.outOfStock,quantity:!f.outOfStock?0:f.quantity}:f) });
        }
        // ── NEW: toggle per-flavor price increase
        function toggleFlavorPriceUp(name) {
            setForm({ ...form, flavors: form.flavors.map(f=>f.name===name?{...f,priceUp:!f.priceUp}:f) });
        }

        // Sale type button style
        function saleTypeBtnStyle(type) {
            const active = form.saleType === type;
            return {
                flex:1, padding:"10px 6px", borderRadius:10, border:"none", cursor:"pointer", fontWeight:700, fontSize:13,
                background: active ? "linear-gradient(135deg,#f59e0b,#f97316)" : "rgba(255,255,255,0.06)",
                color: active ? "#1a1a2e" : "rgba(255,255,255,0.5)",
                transition:"all 0.15s",
            };
        }

        return e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:200, backdropFilter:"blur(4px)" }, onClick:ev=>{ if(ev.target===ev.currentTarget) onClose(); }},
            e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"24px 24px 0 0", padding:"28px 24px 48px", width:"100%", maxWidth:520, maxHeight:"94vh", overflowY:"auto" }},
                e("div", { style:{ width:36, height:4, background:"rgba(255,255,255,0.15)", borderRadius:2, margin:"0 auto 24px" }}),
                e("div", { style:{ fontWeight:800, fontSize:18, marginBottom:24, color:"white" }}, isAdd ? "➕ Add New Item" : "✏️ Edit Item"),

                e(InputField, { label:"Item Name *",    value:form.name,     onChange:ev=>setForm({...form,name:ev.target.value}),     placeholder:"e.g. Maggi Noodles" }),
                e(InputField, { label:"Category",       value:form.category, onChange:ev=>setForm({...form,category:ev.target.value}), placeholder:"e.g. Noodles, Sweets, Chips" }),
                e(InputField, { label:"Total Quantity", value:form.quantity, onChange:ev=>setForm({...form,quantity:ev.target.value}), placeholder:"0", type:"number" }),

                // ── SALE TYPE TOGGLE ─────────────────────────────────────
                e("div", { style:{ marginBottom:16 }},
                    e("label", { style:S.label }, "Sold As"),
                    e("div", { style:{ display:"flex", gap:8 }},
                        SALE_TYPES.map(type =>
                            e("button", { key:type, onClick:()=>setForm({...form,saleType:type}), style:saleTypeBtnStyle(type) },
                                type === "Loose" ? "📦 Loose" : type === "Box" ? "🗃️ Box" : "📦🗃️ Both"
                            )
                        )
                    )
                ),

                // prices
                e("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }},
                    e("div", null,
                        e("label", { style:S.label }, "Selling Price"),
                        e("div", { style:{ position:"relative" }},
                            e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"rgba(255,255,255,0.3)", fontSize:13, fontWeight:600 }}, "R"),
                            e("input", { type:"number", value:form.sellPrice, onChange:ev=>setForm({...form,sellPrice:ev.target.value}), placeholder:"0.00", style:{ ...S.input, paddingLeft:26 }})
                        )
                    ),
                    e("div", null,
                        e("label", { style:S.label }, "Cost Price"),
                        e("div", { style:{ position:"relative" }},
                            e("span", { style:{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"rgba(255,255,255,0.3)", fontSize:13, fontWeight:600 }}, "R"),
                            e("input", { type:"number", value:form.costPrice, onChange:ev=>setForm({...form,costPrice:ev.target.value}), placeholder:"0.00", style:{ ...S.input, paddingLeft:26 }})
                        )
                    )
                ),

                // margin
                margin !== null && e("div", { style:{ background:parseFloat(margin)>=20?"rgba(16,185,129,0.1)":"rgba(245,158,11,0.1)", border:`1px solid ${parseFloat(margin)>=20?"rgba(16,185,129,0.2)":"rgba(245,158,11,0.2)"}`, borderRadius:10, padding:"10px 14px", marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center" }},
                    e("span", { style:{ fontSize:12, color:"rgba(255,255,255,0.5)", fontWeight:600 }}, "Profit Margin"),
                    e("span", { style:{ fontSize:14, fontWeight:800, color:parseFloat(margin)>=20?"#34d399":"#fbbf24" }}, margin + "%")
                ),

                // toggles
                e(ToggleRow, { on:form.priceUp, onClick:()=>setForm({...form,priceUp:!form.priceUp}), label:"Item Price Increased", sub:"Flag this item's overall price went up" }),

                // ── FLAVORS ──────────────────────────────────────────────
                e("div", { style:{ marginBottom:24 }},
                    e("div", { style:{ fontWeight:700, fontSize:13, color:"rgba(255,255,255,0.6)", marginBottom:12, letterSpacing:"0.06em", textTransform:"uppercase" }}, "🎨 Flavors / Variants"),

                    form.flavors.length > 0 && e("div", { style:{ marginBottom:12 }},
                        e("div", { style:{ fontSize:12, color:"rgba(255,255,255,0.35)", marginBottom:8 }}, "Selected — manage each flavor:"),
                        e("div", { style:{ display:"flex", flexDirection:"column", gap:6 }},
                            form.flavors.map(f => e("div", { key:f.name, style:{ background:f.outOfStock?"rgba(239,68,68,0.08)":f.priceUp?"rgba(245,158,11,0.08)":"rgba(16,185,129,0.08)", border:`1px solid ${f.outOfStock?"rgba(239,68,68,0.2)":f.priceUp?"rgba(245,158,11,0.3)":"rgba(16,185,129,0.2)"}`, borderRadius:10, padding:"10px 12px" }},
                                // top row: dot + name + qty + oos + remove
                                e("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom: f.priceUp ? 6 : 0 }},
                                    e("div", { style:{ width:7, height:7, borderRadius:"50%", background:f.outOfStock?"#ef4444":f.priceUp?"#f59e0b":"#10b981", flexShrink:0 }}),
                                    e("span", { style:{ flex:1, fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.85)" }}, f.name),
                                    // price up badge on flavor
                                    f.priceUp && e("span", { style:{ fontSize:10, fontWeight:700, color:"#fbbf24", background:"rgba(245,158,11,0.15)", border:"1px solid rgba(245,158,11,0.3)", borderRadius:6, padding:"1px 6px" }}, "↑ Price Up"),
                                    e("input", { type:"number", value:f.quantity, onChange:ev=>setFlavorQty(f.name,ev.target.value), style:{ width:55, padding:"4px 6px", borderRadius:7, border:"1px solid rgba(255,255,255,0.1)", fontSize:13, textAlign:"center", outline:"none", background:"rgba(255,255,255,0.06)", color:"white" }}),
                                    e("button", { onClick:()=>toggleFlavorStock(f.name), title:f.outOfStock?"Mark in stock":"Mark finished", style:{ background:f.outOfStock?"rgba(16,185,129,0.15)":"rgba(239,68,68,0.15)", border:"none", borderRadius:7, width:28, height:28, cursor:"pointer", fontSize:13, flexShrink:0 }}, f.outOfStock?"✅":"🔴"),
                                    e("button", { onClick:()=>toggleFlavor(f.name), title:"Remove", style:{ background:"rgba(239,68,68,0.15)", border:"none", borderRadius:7, width:28, height:28, cursor:"pointer", color:"#f87171", fontWeight:700, fontSize:14, flexShrink:0 }}, "✕")
                                ),
                                // ── NEW: per-flavor price increase toggle
                                e("button", {
                                    onClick:()=>toggleFlavorPriceUp(f.name),
                                    style:{
                                        marginTop:6, width:"100%", padding:"6px 10px", borderRadius:8, border:`1px solid ${f.priceUp?"rgba(245,158,11,0.4)":"rgba(255,255,255,0.08)"}`,
                                        background:f.priceUp?"rgba(245,158,11,0.12)":"rgba(255,255,255,0.04)",
                                        color:f.priceUp?"#fbbf24":"rgba(255,255,255,0.4)",
                                        fontWeight:700, fontSize:12, cursor:"pointer", textAlign:"left",
                                        display:"flex", alignItems:"center", gap:6
                                    }
                                },
                                    e("span", null, f.priceUp ? "💰 Price increased — tap to remove flag" : "💰 Flag this flavor's price went up")
                                )
                            ))
                        )
                    ),

                    e("input", { value:flavorSearch, onChange:ev=>setFlavorSearch(ev.target.value), placeholder:"🔍  Search flavors to add...", style:{ ...S.input, marginBottom:8 }}),
                    e("div", { style:{ display:"flex", flexWrap:"wrap", gap:6 }},
                        visibleFlavors.map(f => {
                            const sel = selectedNames.includes(f);
                            return e("button", { key:f, onClick:()=>toggleFlavor(f), style:{ padding:"6px 12px", borderRadius:999, fontSize:12, fontWeight:600, cursor:"pointer", border:`1px solid ${sel?"#f59e0b":"rgba(255,255,255,0.1)"}`, background:sel?"rgba(245,158,11,0.15)":"rgba(255,255,255,0.04)", color:sel?"#fbbf24":"rgba(255,255,255,0.55)", transition:"all 0.15s" }}, (sel?"✓ ":"")+f);
                        })
                    )
                ),

                e("div", { style:{ display:"flex", gap:10 }},
                    e("button", { onClick:onClose, style:{ flex:1, padding:14, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontSize:14, fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)" }}, "Cancel"),
                    e("button", { onClick:()=>onSubmit(form), style:{ flex:2, padding:14, borderRadius:12, border:"none", background:"linear-gradient(135deg,#f59e0b,#f97316)", fontSize:14, fontWeight:800, cursor:"pointer", color:"#1a1a2e" }}, isAdd ? "Add Item" : "Save Changes")
                )
            )
        );
    }

    // ── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
        const [items,         setItems]         = useState([]);
        const [flavors,       setFlavors]       = useState(DEFAULT_FLAVORS);
        const [loading,       setLoading]       = useState(true);
        const [search,        setSearch]        = useState("");
        const [filter,        setFilter]        = useState("all");
        const [modal,         setModal]         = useState(null);
        const [toast,         setToast]         = useState(null);
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const [showFlavorMgr, setShowFlavorMgr] = useState(false);
        const [expandedId,    setExpandedId]    = useState(null);

        useEffect(() => {
            if (!db) { setLoading(false); return; }
            const itemsRef = db.ref("items");
            itemsRef.on("value", snap => {
                const val = snap.val();
                if (val) {
                    const arr = Object.entries(val).map(([key, item]) => ({ ...item, id: key }));
                    arr.sort((a, b) => (b.createdAt||0) - (a.createdAt||0));
                    setItems(arr);
                } else { setItems([]); }
                setLoading(false);
            });
            const flavorsRef = db.ref("flavors");
            flavorsRef.on("value", snap => { const val = snap.val(); if (val) setFlavors(val); });
            return () => { itemsRef.off(); flavorsRef.off(); };
        }, []);

        function showToast(msg) { setToast(msg); setTimeout(()=>setToast(null), 3000); }

        function handleSubmit(form) {
            if (!form.name.trim()) return showToast("⚠️ Item name is required");
            const qty = parseInt(form.quantity);
            if (isNaN(qty) || qty < 0) return showToast("⚠️ Enter a valid quantity");
            const base = {
                name:       form.name.trim(),
                category:   form.category.trim(),
                quantity:   qty,
                sellPrice:  form.sellPrice ? parseFloat(form.sellPrice) : null,
                costPrice:  form.costPrice ? parseFloat(form.costPrice) : null,
                priceUp:    form.priceUp,
                saleType:   form.saleType || "Loose",
                outOfStock: qty === 0,
                flavors:    form.flavors.length > 0 ? form.flavors : null,
            };
            if (!db) return showToast("⚠️ No database — upload to GitHub first");
            if (modal === "add") {
                db.ref("items").push({ ...base, createdAt: Date.now() });
                showToast(`✅ "${base.name}" added`);
            } else {
                db.ref("items/" + modal.item.id).update(base);
                showToast(`✏️ "${base.name}" updated`);
            }
            setModal(null);
        }

        function toggleOutOfStock(item) {
            if (!db) return;
            const nowOos = !item.outOfStock;
            db.ref("items/" + item.id).update({ outOfStock: nowOos, quantity: nowOos ? 0 : item.quantity });
            showToast(nowOos ? `🔴 "${item.name}" marked finished` : `🟢 "${item.name}" back in stock`);
        }

        function doDelete() {
            if (!deleteConfirm || !db) return;
            db.ref("items/" + deleteConfirm.id).remove();
            showToast(`🗑️ "${deleteConfirm.name}" deleted`);
            setDeleteConfirm(null);
        }

        function saveFlavorsHandler(list) {
            if (!db) return;
            db.ref("flavors").set(list);
            showToast("✅ Flavor list updated");
        }

        const filtered = items.filter(item => {
            const m = item.name.toLowerCase().includes(search.toLowerCase()) ||
                      (item.category||"").toLowerCase().includes(search.toLowerCase());
            if (!m) return false;
            if (filter==="instock")  return !item.outOfStock;
            if (filter==="finished") return  item.outOfStock;
            if (filter==="priceup")  return  item.priceUp;
            return true;
        });

        const stats = {
            total:    items.length,
            inStock:  items.filter(i=>!i.outOfStock).length,
            finished: items.filter(i=> i.outOfStock).length,
            priceUp:  items.filter(i=> i.priceUp).length,
        };

        // Sale type display helper
        function saleTypeBadge(type) {
            if (!type || type === "Loose") return e(Badge, {color:"blue"}, "📦 Loose");
            if (type === "Box")            return e(Badge, {color:"indigo"}, "🗃️ Box");
            if (type === "Both")           return e(Badge, {color:"pink"}, "📦🗃️ Both");
            return null;
        }

        return e("div", { style:{ minHeight:"100vh", background:"#0f0f13", fontFamily:"'Inter',Arial,sans-serif", paddingBottom:80 }},

            // ── HEADER ────────────────────────────────────────────────────
            e("div", { style:{ background:"rgba(22,22,31,0.95)", backdropFilter:"blur(20px)", borderBottom:"1px solid rgba(255,255,255,0.06)", padding:"16px 20px", position:"sticky", top:0, zIndex:100 }},
                e("div", { style:{ maxWidth:720, margin:"0 auto" }},
                    e("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }},

                        // LEFT: back button (editor) or logo
                        e("div", { style:{ display:"flex", alignItems:"center", gap:10 }},
                            // ── BACK BUTTON — only for editor ─────────────
                            canEdit && e("button", {
                                onClick: () => {
                                    if (window.confirm("Go back to login screen?")) {
                                        document.getElementById("content").style.display = "none";
                                        document.getElementById("login-gate").style.display = "flex";
                                        document.getElementById("pass-field").value = "";
                                        document.getElementById("error-msg").style.display = "none";
                                    }
                                },
                                title: "Back to login",
                                style:{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", fontSize:16, flexShrink:0 }
                            }, "←"),

                            // logo + name
                            e("div", { style:{ display:"flex", alignItems:"center", gap:10 }},
                                e("div", { style:{ width:36, height:36, background:"linear-gradient(135deg,#f59e0b,#ef4444)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, boxShadow:"0 4px 12px rgba(245,158,11,0.3)", flexShrink:0 }}, "🛒"),
                                e("div", null,
                                    e("div", { style:{ fontSize: canEdit ? 13 : 14, fontWeight:900, color:"white", letterSpacing:"-0.3px", lineHeight:1.2 }}, "SANKA CASH AND CARRY"),
                                    e("div", { style:{ fontSize:10, fontWeight:500, color:canEdit?"rgba(245,158,11,0.8)":"rgba(52,211,153,0.7)", marginTop:1 }},
                                        canEdit ? "✏️ Editor Mode" : "👁 View Only — Live Stock"
                                    )
                                )
                            )
                        ),

                        // RIGHT: action buttons (editor only)
                        canEdit && e("div", { style:{ display:"flex", gap:7 }},
                            e("button", { onClick:()=>setShowFlavorMgr(true), style:{ background:"rgba(255,255,255,0.06)", color:"rgba(255,255,255,0.7)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, padding:"8px 12px", fontWeight:700, fontSize:11, cursor:"pointer" }}, "🎨"),
                            e("button", { onClick:()=>setModal("add"), style:{ background:"linear-gradient(135deg,#f59e0b,#f97316)", color:"#1a1a2e", border:"none", borderRadius:10, padding:"8px 14px", fontWeight:800, fontSize:12, cursor:"pointer", boxShadow:"0 4px 12px rgba(245,158,11,0.25)" }}, "+ Add")
                        )
                    ),

                    // stats row
                    e("div", { style:{ display:"flex", gap:7, flexWrap:"wrap" }},
                        [{label:"Total",value:stats.total,color:"rgba(255,255,255,0.5)"},{label:"In Stock",value:stats.inStock,color:"#34d399"},{label:"Finished",value:stats.finished,color:"#f87171"},{label:"Price ↑",value:stats.priceUp,color:"#fbbf24"}]
                        .map(s => e("div", { key:s.label, style:{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:10, padding:"6px 12px", display:"flex", gap:7, alignItems:"center" }},
                            e("span", { style:{ fontSize:16, fontWeight:900, color:s.color }}, s.value),
                            e("span", { style:{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:600 }}, s.label)
                        ))
                    )
                )
            ),

            // ── SEARCH + FILTER + LIST ─────────────────────────────────────
            e("div", { style:{ maxWidth:720, margin:"0 auto", padding:"18px 14px 0" }},
                e("div", { style:{ display:"flex", gap:9, marginBottom:14, flexWrap:"wrap" }},
                    e("input", { value:search, onChange:ev=>setSearch(ev.target.value), placeholder:"🔍  Search items or categories...", style:{ flex:1, minWidth:160, padding:"11px 14px", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)", fontSize:14, background:"rgba(255,255,255,0.05)", color:"white", outline:"none", fontFamily:"'Inter',Arial,sans-serif" }}),
                    e("select", { value:filter, onChange:ev=>setFilter(ev.target.value), style:{ padding:"11px 12px", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)", fontSize:12, background:"#1a1a24", color:"rgba(255,255,255,0.7)", cursor:"pointer", outline:"none", fontFamily:"'Inter',Arial,sans-serif" }},
                        e("option",{value:"all"},"All Items"),
                        e("option",{value:"instock"},"In Stock"),
                        e("option",{value:"finished"},"Finished"),
                        e("option",{value:"priceup"},"Price Increased")
                    )
                ),

                loading && e("div", { style:{ textAlign:"center", padding:"60px 20px", color:"rgba(255,255,255,0.3)" }},
                    e("div", { style:{ fontSize:36, marginBottom:12 }}, "⏳"),
                    e("div", { style:{ fontSize:14, fontWeight:600 }}, "Loading live stock...")
                ),

                !loading && filtered.length===0 && e("div", { style:{ textAlign:"center", padding:"80px 20px" }},
                    e("div", { style:{ fontSize:52, marginBottom:14, opacity:0.5 }}, "📦"),
                    e("div", { style:{ fontSize:16, fontWeight:700, color:"rgba(255,255,255,0.3)" }}, "No items found"),
                    e("div", { style:{ fontSize:13, marginTop:6, color:"rgba(255,255,255,0.2)" }},
                        items.length===0 ? (canEdit?"Tap '+ Add' to get started":"No stock has been added yet") : "Try a different search or filter"
                    )
                ),

                !loading && filtered.length>0 && e("div", { style:{ display:"flex", flexDirection:"column", gap:8 }},
                    filtered.map(item => {
                        const isExpanded     = expandedId === item.id;
                        const hasFlavors     = item.flavors && item.flavors.length > 0;
                        const availCount     = hasFlavors ? item.flavors.filter(f=>!f.outOfStock).length : 0;
                        const finishedCount  = hasFlavors ? item.flavors.filter(f=>f.outOfStock).length : 0;
                        const priceUpFlavors = hasFlavors ? item.flavors.filter(f=>f.priceUp).length : 0;
                        const hasPartialFlavorWarn = !item.outOfStock && hasFlavors && finishedCount > 0;

                        const cardStyle = item.outOfStock
                            ? S.cardWarn
                            : hasPartialFlavorWarn
                                ? S.cardFlavorWarn
                                : item.priceUp
                                    ? S.cardPrice
                                    : S.card;

                        const dotColor = item.outOfStock ? "#ef4444" : hasPartialFlavorWarn ? "#f59e0b" : "#10b981";
                        const dotShadow = item.outOfStock ? "rgba(239,68,68,0.15)" : hasPartialFlavorWarn ? "rgba(245,158,11,0.2)" : "rgba(16,185,129,0.15)";

                        const margin = (item.sellPrice && item.costPrice)
                            ? ((item.sellPrice - item.costPrice) / item.sellPrice * 100).toFixed(1) : null;

                        return e("div", { key:item.id, style:cardStyle },
                            e("div", { style:{ padding:"13px 14px", display:"flex", alignItems:"center", gap:11 }},
                                // dot
                                e("div", { style:{ width:10, height:10, borderRadius:"50%", background:dotColor, flexShrink:0, boxShadow:`0 0 0 3px ${dotShadow}` }}),

                                // info
                                e("div", { style:{ flex:1, minWidth:0 }},
                                    e("div", { style:{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap", marginBottom:5 }},
                                        e("span", { style:{ fontWeight:700, fontSize:15, color:item.outOfStock?"rgba(255,255,255,0.35)":"white", textDecoration:item.outOfStock?"line-through":"none", letterSpacing:"-0.2px" }}, item.name),
                                        item.priceUp    && e(Badge,{color:"orange"}, "Price ↑"),
                                        item.outOfStock && e(Badge,{color:"red"},    "Finished"),
                                        hasPartialFlavorWarn && e(Badge,{color:"amber"}, `⚠️ ${finishedCount} flavor${finishedCount>1?"s":""} finished`),
                                        priceUpFlavors > 0 && e(Badge,{color:"orange"}, `💰 ${priceUpFlavors} flavor${priceUpFlavors>1?"s":""} price ↑`)
                                    ),
                                    e("div", { style:{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }},
                                        item.category && e("span", { style:{ fontSize:11, color:"rgba(255,255,255,0.35)", fontWeight:500 }}, "📁 "+item.category),
                                        // sale type badge
                                        saleTypeBadge(item.saleType),
                                        e("span", { style:{ fontSize:11, fontWeight:item.quantity<=3?700:500, color:(item.quantity<=3&&!item.outOfStock)?"#f87171":"rgba(255,255,255,0.45)" }},
                                            "Qty: "+item.quantity+(item.quantity<=3&&item.quantity>0?" ⚠️":"")
                                        ),
                                        // sell price — visible to all
                                        item.sellPrice != null && e("span", { style:{ fontSize:11, color:"#34d399", fontWeight:700, background:"rgba(16,185,129,0.1)", border:"1px solid rgba(16,185,129,0.15)", borderRadius:6, padding:"1px 7px" }}, "R"+item.sellPrice.toFixed(2)),
                                        // cost price + margin — editors only
                                        canEdit && item.costPrice != null && e("span", { style:{ fontSize:11, color:"#a5b4fc", fontWeight:700, background:"rgba(99,102,241,0.1)", border:"1px solid rgba(99,102,241,0.15)", borderRadius:6, padding:"1px 7px" }}, "Cost R"+item.costPrice.toFixed(2)),
                                        canEdit && margin && e("span", { style:{ fontSize:11, color:parseFloat(margin)>=20?"#34d399":"#fbbf24", fontWeight:700 }}, margin+"% margin"),
                                        hasFlavors && e("button", { onClick:()=>setExpandedId(isExpanded?null:item.id), style:{ background:"rgba(99,102,241,0.12)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:999, padding:"2px 9px", fontSize:10, fontWeight:700, color:"#a5b4fc", cursor:"pointer" }}, `🎨 ${availCount}/${item.flavors.length} ${isExpanded?"▲":"▼"}`)
                                    )
                                ),

                                // action buttons — editors only
                                canEdit && e("div", { style:{ display:"flex", gap:5, flexShrink:0 }},
                                    e(Btn, { onClick:()=>toggleOutOfStock(item), title:item.outOfStock?"Mark in stock":"Mark finished", style:{ background:item.outOfStock?"rgba(16,185,129,0.15)":"rgba(239,68,68,0.15)" }}, item.outOfStock?"✅":"🔴"),
                                    e(Btn, { onClick:()=>setModal({type:"edit",item}), title:"Edit", style:{ background:"rgba(99,102,241,0.15)" }}, "✏️"),
                                    e(Btn, { onClick:()=>setDeleteConfirm(item), title:"Delete", style:{ background:"rgba(239,68,68,0.1)" }}, "🗑️")
                                )
                            ),

                            // flavor expand panel
                            isExpanded && hasFlavors && e("div", { style:{ borderTop:"1px solid rgba(255,255,255,0.06)", padding:"12px 14px 14px", background:"rgba(0,0,0,0.2)" }},
                                e("div", { style:{ fontSize:10, fontWeight:700, color:"rgba(255,255,255,0.3)", marginBottom:8, letterSpacing:"0.08em", textTransform:"uppercase" }}, "Flavors"),
                                e("div", { style:{ display:"flex", flexWrap:"wrap", gap:6 }},
                                    item.flavors.map(f => e("div", { key:f.name, style:{ display:"flex", alignItems:"center", gap:5, background:f.outOfStock?"rgba(239,68,68,0.12)":f.priceUp?"rgba(245,158,11,0.12)":"rgba(16,185,129,0.12)", border:`1px solid ${f.outOfStock?"rgba(239,68,68,0.2)":f.priceUp?"rgba(245,158,11,0.35)":"rgba(16,185,129,0.2)"}`, borderRadius:999, padding:"4px 11px" }},
                                        e("div", { style:{ width:6, height:6, borderRadius:"50%", background:f.outOfStock?"#ef4444":f.priceUp?"#f59e0b":"#10b981", flexShrink:0 }}),
                                        e("span", { style:{ fontSize:12, fontWeight:700, color:f.outOfStock?"#f87171":f.priceUp?"#fbbf24":"#34d399" }}, f.name),
                                        e("span", { style:{ fontSize:10, fontWeight:600, color:f.outOfStock?"rgba(248,113,113,0.7)":f.priceUp?"rgba(251,191,36,0.8)":"rgba(52,211,153,0.7)" }},
                                            f.outOfStock ? "· Finished" : f.priceUp ? "· Price ↑" : `· ${f.quantity} left`
                                        )
                                    ))
                                )
                            )
                        );
                    })
                )
            ),

            // MODALS
            modal         && e(ItemModal,     { modal, flavors, onClose:()=>setModal(null), onSubmit:handleSubmit }),
            showFlavorMgr && e(FlavorManager, { flavors, onClose:()=>setShowFlavorMgr(false), onSave:saveFlavorsHandler }),

            // DELETE CONFIRM
            deleteConfirm && e("div", { style:{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:20, backdropFilter:"blur(4px)" }},
                e("div", { style:{ background:"#16161f", border:"1px solid rgba(255,255,255,0.1)", borderRadius:20, padding:28, maxWidth:320, width:"100%", textAlign:"center" }},
                    e("div", { style:{ fontSize:42, marginBottom:12 }}, "🗑️"),
                    e("div", { style:{ fontWeight:800, fontSize:17, marginBottom:8, color:"white" }}, "Delete Item?"),
                    e("div", { style:{ color:"rgba(255,255,255,0.4)", fontSize:14, marginBottom:24 }}, `"${deleteConfirm.name}" will be permanently removed.`),
                    e("div", { style:{ display:"flex", gap:10 }},
                        e("button", { onClick:()=>setDeleteConfirm(null), style:{ flex:1, padding:13, borderRadius:12, border:"1px solid rgba(255,255,255,0.1)", background:"transparent", fontWeight:700, cursor:"pointer", color:"rgba(255,255,255,0.6)", fontSize:14 }}, "Cancel"),
                        e("button", { onClick:doDelete, style:{ flex:1, padding:13, borderRadius:12, border:"none", background:"linear-gradient(135deg,#ef4444,#dc2626)", color:"white", fontWeight:800, cursor:"pointer", fontSize:14 }}, "Delete")
                    )
                )
            ),

            // TOAST
            toast && e("div", { style:{ position:"fixed", bottom:28, left:"50%", transform:"translateX(-50%)", background:"rgba(22,22,31,0.95)", backdropFilter:"blur(12px)", border:"1px solid rgba(255,255,255,0.1)", color:"white", padding:"13px 24px", borderRadius:14, fontWeight:600, fontSize:13, boxShadow:"0 8px 32px rgba(0,0,0,0.4)", zIndex:400, whiteSpace:"nowrap" }}, toast)
        );
    }

    ReactDOM.render(React.createElement(App), document.getElementById("inventory-root"));
}
</script>
</body>
</html>
