    <script>
        // Verified SHA-256 hash for "SANKA@2026"
        const secureHash = "780098f98ec88b90f488667da7806f368f3a8b609c95d9715a13340578b88d2f";

        async function validate() {
            // .trim() removes any accidental spaces at the start or end
            const input = document.getElementById("pass-field").value.trim();
            const msg = document.getElementById("error-msg");
            
            if (!input) return;

            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            console.log("Input Hash:", inputHash); // For debugging if needed

            if (inputHash === secureHash) {
                document.getElementById("login-gate").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                msg.style.display = "block";
                document.getElementById("pass-field").value = "";
            }
        }
        
        // This allows you to just press "Enter" on your keyboard/phone to login
        document.getElementById("pass-field").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                validate();
            }
        });
    </script>
