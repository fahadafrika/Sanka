<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanka Stock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0f0f13; color: white; min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* LOGIN SCREEN */
        #login-gate {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f0f13 100%);
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 40px 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; width: 90%; max-width: 350px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-box h2 { margin: 15px 0; font-size: 24px; letter-spacing: -0.5px; }
        #pass-field {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; font-size: 16px; margin-bottom: 15px; outline: none;
        }
        #login-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #f59e0b, #ea580c); color: #000;
            font-size: 16px; font-weight: 800; cursor: pointer;
        }
        #error-msg { display: none; color: #f87171; margin-top: 15px; font-size: 14px; font-weight: 600; }
        
        #content { display: none; }

        /* Dashboard Styles */
        .header { background: #16161f; padding: 20px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #2d2d39; }
        .card { background: #1a1a24; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2d2d39; }
        
        /* Mobile Specific: Prevent Zoom */
        @media screen and (max-width: 768px) {
            input { font-size: 16px !important; }
        }
    </style>
</head>
<body>

<div id="login-gate">
    <div class="login-box">
        <div style="font-size: 50px;">🛒</div>
        <h2>Sanka Stock</h2>
        <input type="password" id="pass-field" placeholder="Enter Password" autocomplete="current-password" />
        <button id="login-btn" onclick="validate()">Access System</button>
        <p id="error-msg">❌ Password Incorrect</p>
    </div>
</div>

<div id="content">
    <div id="inventory-root"></div>
</div>

<script>
// ─── CONFIGURATION ──────────────────────────────────────────────────
// Replace the values below with your Firebase keys for multi-phone sync.
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project.firebaseapp.com",
    databaseURL: "https://your-project.firebaseio.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "...",
    appId: "..."
};

// Password Fingerprint for: Sanka@4173
const secureHash = "d92d0652aad7fad989241680673322040974768393e80931131154379a091428";

// ─── LOGIN LOGIC ────────────────────────────────────────────────────
async function validate() {
    const input = document.getElementById("pass-field").value.trim();
    const msg = document.getElementById("error-msg");
    
    if (!input) return;

    // Create a SHA-256 hash of the input
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    if (inputHash === secureHash) {
        document.getElementById("login-gate").style.display = "none";
        document.getElementById("content").style.display = "block";
        startApp();
    } else {
        msg.style.display = "block";
        document.getElementById("pass-field").value = "";
    }
}

document.getElementById("pass-field").addEventListener("keypress", (e) => {
    if (e.key === "Enter") validate();
});

// ─── APP LOGIC ──────────────────────────────────────────────────────
function startApp() {
    const { useState, useEffect } = React;
    const e = React.createElement;

    // Initialize Firebase if keys are set
    let db = null;
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    }

    function App() {
        const [items, setItems] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            if (db) {
                db.ref('inventory').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setItems(data ? Object.values(data) : []);
                    setLoading(false);
                });
            } else {
                const localData = JSON.parse(localStorage.getItem('sanka-stock') || '[]');
                setItems(localData);
                setLoading(false);
            }
        }, []);

        const save = (newList) => {
            setItems(newList);
            localStorage.setItem('sanka-stock', JSON.stringify(newList));
            if (db) {
                const updates = {};
                newList.forEach(item => updates[item.id] = item);
                db.ref('inventory').set(updates);
            }
        };

        const addItem = () => {
            const name = prompt("Enter Item Name:");
            if (name) {
                const newItem = { id: Date.now(), name, quantity: 0 };
                save([...items, newItem]);
            }
        };

        const updateQty = (id, change) => {
            const newList = items.map(item => {
                if (item.id === id) {
                    return { ...item, quantity: Math.max(0, item.quantity + change) };
                }
                return item;
            });
            save(newList);
        };

        return e("div", null, 
            e("div", { className: "header" },
                e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", maxWidth: "600px", margin: "0 auto" }},
                    e("h2", null, "Stock Control"),
                    e("button", { onClick: addItem, style: { background: "#f59e0b", border: "none", padding: "10px 20px", borderRadius: "10px", fontWeight: "800" }}, "+ Add")
                )
            ),
            e("div", { style: { padding: "20px", maxWidth: "600px", margin: "0 auto" }},
                items.length === 0 ? e("p", { style: { color: "#666", textAlign: "center", marginTop: "40px" }}, "No items yet. Tap + Add to start.") :
                items.map(item => e("div", { key: item.id, className: "card" },
                    e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" }},
                        e("div", null,
                            e("div", { style: { fontWeight: "700", fontSize: "18px" }}, item.name),
                            e("div", { style: { color: "#f59e0b", fontSize: "20px", fontWeight: "900", marginTop: "5px" }}, `Qty: ${item.quantity}`)
                        ),
                        e("div", { style: { display: "flex", gap: "10px" }},
                            e("button", { onClick: () => updateQty(item.id, -1), style: { width: "45px", height: "45px", borderRadius: "10px", border: "none", background: "#333", color: "white", fontSize: "20px" }}, "-"),
                            e("button", { onClick: () => updateQty(item.id, 1), style: { width: "45px", height: "45px", borderRadius: "10px", border: "none", background: "#f59e0b", color: "#000", fontSize: "20px" }}, "+")
                        )
                    )
                ))
            )
        );
    }

    ReactDOM.render(e(App), document.getElementById("inventory-root"));
}
</script>
</body>
</html>
