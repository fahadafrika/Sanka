<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanka Stock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #f0f0f0; 
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #login-gate {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; maxWidth: 340px;
        }
        .login-box h2 { margin-bottom: 24px; color: #1a1a2e; font-weight: 800; }
        #pass-field {
            width: 100%; padding: 14px; border: 1.5px solid #eee;
            border-radius: 12px; font-size: 16px; margin-bottom: 12px;
            outline: none; transition: border-color 0.2s;
        }
        #pass-field:focus { border-color: #f59e0b; }
        #login-btn {
            width: 100%; padding: 14px; background: #1a1a2e; color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        #error-msg { display: none; color: #ef4444; margin-top: 12px; font-size: 14px; font-weight: 600; }
        #content { display: none; }

        /* Mobile Fix: Prevents auto-zoom on inputs */
        @media screen and (max-width: 768px) {
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body>

<div id="login-gate">
    <div class="login-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🛒</div>
        <h2>Sanka Stock</h2>
        <input type="password" id="pass-field" placeholder="Access Password" />
        <button id="login-btn" onclick="validate()">Enter Dashboard</button>
        <p id="error-msg">❌ Incorrect password.</p>
    </div>
</div>

<div id="content">
    <div id="inventory-root"></div>
</div>

<script>
// ─── FIREBASE CONFIG (Replace with your keys) ───────────────────────────
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "your-project.firebaseapp.com",
  databaseURL: "https://your-project.firebaseio.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

// Initialize only if keys are provided, else fallback to LocalStorage
let db = null;
try {
    if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    }
} catch(e) { console.error("Firebase init failed", e); }

// ─── PASSWORD GATE ─────────────────────────────────────────────────────
const secureHash = "f94576304419965909241680673322040974768393e80931131154379a091428";


async function validate() {
    const input = document.getElementById("pass-field").value.trim();
    const msg = document.getElementById("error-msg");
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    
    if (inputHash === secureHash) {
        document.getElementById("login-gate").style.display = "none";
        document.getElementById("content").style.display = "block";
        mountInventory();
    } else {
        msg.style.display = "block";
        document.getElementById("pass-field").value = "";
    }
}

document.getElementById("pass-field").addEventListener("keypress", (e) => {
    if (e.key === "Enter") validate();
});

// ─── STORAGE ────────────────────────────────────────────────────────────
const ITEMS_KEY = "sanka-items";
const FLAVORS_KEY = "sanka-flavors";
const DEFAULT_FLAVORS = ["Durban Curry", "Chicken", "Beef", "Original", "Cheese", "Plain"];

function loadItems() { return JSON.parse(localStorage.getItem(ITEMS_KEY)) || []; }
function loadFlavors() { return JSON.parse(localStorage.getItem(FLAVORS_KEY)) || DEFAULT_FLAVORS; }
function saveItems(v) { localStorage.setItem(ITEMS_KEY, JSON.stringify(v)); }
function saveFlavors(v) { localStorage.setItem(FLAVORS_KEY, JSON.stringify(v)); }

// ─── APP ENGINE ─────────────────────────────────────────────────────────
function mountInventory() {
    const { useState, useEffect } = React;
    const e = React.createElement;

    // Small Components
    const Badge = ({ children, color }) => {
        const colors = {
            orange: { background: "#fff7ed", color: "#9a3412", border: "1px solid #fed7aa" },
            red: { background: "#fef2f2", color: "#991b1b", border: "1px solid #fecaca" },
            green: { background: "#f0fdf4", color: "#166534", border: "1px solid #bbf7d0" }
        };
        return e("span", { style: { ...colors[color], padding: "2px 8px", borderRadius: "6px", fontSize: "11px", fontWeight: "700" }}, children);
    };

    function App() {
        const [items, setItems] = useState(loadItems());
        const [flavors, setFlavors] = useState(loadFlavors());
        const [search, setSearch] = useState("");

        // If Firebase is active, use it
        useEffect(() => {
            if (db) {
                db.ref('inventory').on('value', (snap) => setItems(snap.val() ? Object.values(snap.val()) : []));
                db.ref('flavors').on('value', (snap) => setFlavors(snap.val() || DEFAULT_FLAVORS));
            }
        }, []);

        const persistItems = (newItems) => {
            setItems(newItems);
            saveItems(newItems);
            if (db) db.ref('inventory').set(newItems.reduce((acc, item) => ({...acc, [item.id]: item}), {}));
        };

        const filtered = items.filter(i => i.name.toLowerCase().includes(search.toLowerCase()));

        return e("div", { style: { maxWidth: "600px", margin: "0 auto", padding: "20px" }},
            e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }},
                e("h1", { style: { fontSize: "24px" }}, "Stock Control"),
                e("button", { 
                    onClick: () => {
                        const name = prompt("Item Name:");
                        if(name) persistItems([...items, { id: Date.now(), name, quantity: 0, outOfStock: false }]);
                    },
                    style: { background: "#f59e0b", border: "none", padding: "10px 15px", borderRadius: "10px", fontWeight: "700" }
                }, "+ Add")
            ),
            e("input", { 
                placeholder: "Search items...", 
                value: search, 
                onChange: (ev) => setSearch(ev.target.value),
                style: { width: "100%", padding: "12px", borderRadius: "12px", border: "1.5px solid #ddd", marginBottom: "20px", outline: "none" }
            }),
            e("div", { style: { display: "flex", flexDirection: "column", gap: "10px" }},
                filtered.map(item => e("div", { 
                    key: item.id, 
                    style: { background: "white", padding: "15px", borderRadius: "15px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 2px 5px rgba(0,0,0,0.05)" }
                },
                    e("div", null,
                        e("div", { style: { fontWeight: "700" }}, item.name),
                        e("div", { style: { fontSize: "13px", color: "#666" }}, `Qty: ${item.quantity}`)
                    ),
                    e("button", {
                        onClick: () => {
                            const newQty = prompt("Enter new quantity:", item.quantity);
                            if(newQty !== null) persistItems(items.map(i => i.id === item.id ? {...i, quantity: parseInt(newQty)} : i));
                        },
                        style: { background: "#eee", border: "none", padding: "8px 12px", borderRadius: "8px" }
                    }, "Edit")
                ))
            )
        );
    }

    ReactDOM.render(e(App), document.getElementById("inventory-root"));
}
</script>
</body>
</html>
