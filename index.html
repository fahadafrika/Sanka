<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanka Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f0f0f0;min-height:100vh;}
#login-gate{display:flex;justify-content:center;align-items:center;min-height:100vh;}
.login-box{background:white;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center;width:320px;}
.login-box h2{margin-bottom:20px;color:#333;}
#pass-field{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:12px;outline:none;}
#pass-field:focus{border-color:#555;}
#login-btn{width:100%;padding:12px;background:#222;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
#login-btn:hover{background:#444;}
#error-msg{display:none;color:red;margin-top:10px;font-size:14px;}
#content{display:none;padding:20px;}
button{cursor:pointer;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-box">
    <h2>Welcome to Sanka</h2>
    <input type="password" id="pass-field" placeholder="Enter password" />
    <button id="login-btn" onclick="validate()">Enter</button>
    <p id="error-msg">❌ Incorrect password. Try again.</p>
  </div>
</div>

<div id="content">
  <div id="inventory-root"></div>
</div>

<script>
// PASSWORD GATE
const secureHash = "96ef6e4a01ac8a6b95e707616c8f4bddfb83b8975aa379f9ee0b73957fc7669a";

async function validate(){
    const input = document.getElementById("pass-field").value.trim();
    const msg = document.getElementById("error-msg");
    if(!input) return;
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const inputHash = hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
    if(inputHash === secureHash){
        document.getElementById("login-gate").style.display = "none";
        document.getElementById("content").style.display = "block";
        mountInventory();
    } else {
        msg.style.display = "block";
        document.getElementById("pass-field").value = "";
    }
}

document.getElementById("pass-field").addEventListener("keypress", function(e){
    if(e.key==="Enter") validate();
});

// STORAGE
const ITEMS_KEY = "sanka-inventory-v1";
const FLAVORS_KEY = "sanka-flavors-v1";

const DEFAULT_FLAVORS = ["Durban Curry","Chicken","Beef","Original","Cheese","BBQ","Tomato","Spicy","Plain","Strawberry","Bubblegum","Cola","Lemon","Grape","Watermelon"];

function loadItems(){try{const r=localStorage.getItem(ITEMS_KEY); return r?JSON.parse(r):[];}catch{return []}}
function loadFlavors(){try{const r=localStorage.getItem(FLAVORS_KEY); return r?JSON.parse(r):DEFAULT_FLAVORS;}catch{return DEFAULT_FLAVORS}}
function saveItems(v){localStorage.setItem(ITEMS_KEY,JSON.stringify(v))}
function saveFlavors(v){localStorage.setItem(FLAVORS_KEY,JSON.stringify(v))}

// APP
function mountInventory(){
    const { useState } = React;
    const e = React.createElement;

    function App(){
        const [items,setItems] = useState(loadItems());
        const [flavors,setFlavors] = useState(loadFlavors());
        const [newItem,setNewItem] = useState({name:"",category:"",quantity:0,price:0});
        
        function addItem(){
            if(!newItem.name) return alert("Name required");
            const id = Date.now();
            const updated = [...items,{...newItem,id}];
            setItems(updated); saveItems(updated);
            setNewItem({name:"",category:"",quantity:0,price:0});
        }
        function deleteItem(id){
            if(!confirm("Delete this item?")) return;
            const updated = items.filter(it=>it.id!==id);
            setItems(updated); saveItems(updated);
        }

        return e("div",null,
            e("h1",null,"📦 Inventory"),
            e("div",{style:{marginBottom:12}},
                e("input",{placeholder:"Name",value:newItem.name,onChange:e=>setNewItem({...newItem,name:e.target.value})}),
                e("input",{placeholder:"Category",value:newItem.category,onChange:e=>setNewItem({...newItem,category:e.target.value})}),
                e("input",{type:"number",placeholder:"Qty",value:newItem.quantity,onChange:e=>setNewItem({...newItem,quantity:Number(e.target.value)})}),
                e("input",{type:"number",placeholder:"Price",value:newItem.price,onChange:e=>setNewItem({...newItem,price:Number(e.target.value)})}),
                e("button",{onClick:addItem,style:{marginLeft:10,padding:"4px 10px"}}, "Add Item")
            ),
            items.map(it=>e("div",{key:it.id,style:{padding:10,border:"1px solid #ddd",borderRadius:6,marginBottom:6,display:"flex",justifyContent:"space-between"}},
                e("div",null,`${it.name} - ${it.category} - Qty:${it.quantity} - R${it.price}`),
                e("button",{onClick:()=>deleteItem(it.id)},"Delete")
            ))
        );
    }

    ReactDOM.render(e(App),document.getElementById("inventory-root"));
}
</script>

</body>
</html>
